<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SairaX;src:url(saira800.woff2) format("woff2");font-weight:800}
html,body{margin:0;background:transparent}
.i{width:512px;height:512px;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,#1d4a6b 0%,#0c2638 45%,#060f17 100%)}
.i::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px)}
.m{position:absolute;left:0;right:0;top:118px;text-align:center;font:800 232px/1 SairaX,sans-serif;letter-spacing:-6px;color:#fff;text-shadow:0 6px 18px rgba(0,0,0,.45)}
.m b{font-weight:800;background:linear-gradient(180deg,#4FA8F0 22%,#E8B80C 50%,#C24FB0 78%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.bar{position:absolute;left:128px;right:128px;top:372px;height:14px;display:flex;gap:8px}
.bar i{flex:1;transform:skewX(-28deg)}
.bar i:nth-child(1){background:#1E7BD0}.bar i:nth-child(2){background:#E0AE0A}.bar i:nth-child(3){background:#B0409E}
</style></head><body><div class="i" id="icon"><div class="m">S<b>C</b></div><div class="bar"><i></i><i></i><i></i></div></div></body></html>
