<title>StarCraft Muster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,400..900&family=Saira:wdth,wght@75..100,500..700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style id="card-css">/*__CARD_CSS__*/</style>
<style>
:root{
  --bg:#E4E7EB; --panel:#FFFFFF; --panel-2:#F3F4F6; --ink:#09202E; --ink-2:#44525F; --ink-3:#6B7784; --line:#CDD2D8; --line-2:#E2E5E9;
  --accent:#005BA4; --accent-soft:#DCE8F3;
  --terran:#005BA4; --protoss:#BD8A00; --zerg:#823287;
  --min:#1685C2; --gas:#2B8F48;
  --ok:#1F7A45; --ok-soft:#DCF0E3; --warn:#946000; --warn-soft:#F6EBD2; --err:#B5221C; --err-soft:#F8DEDB;
  --navy:#09202E;
  --shadow:0 1px 2px rgba(9,32,46,.08),0 4px 14px rgba(9,32,46,.06);
  --display:"Saira","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F14; --panel:#121920; --panel-2:#18212A; --ink:#E4E9EE; --ink-2:#A2AEBA; --ink-3:#7C8894; --line:#26313C; --line-2:#1D2630;
    --accent:#4E9BDB; --accent-soft:#12283A;
    --terran:#4E9BDB; --protoss:#E3B236; --zerg:#C07ACB;
    --min:#52B7EC; --gas:#5FC67C;
    --ok:#5CC487; --ok-soft:#12291D; --warn:#E3B04F; --warn-soft:#332611; --err:#F2786E; --err-soft:#3A1714;
    --navy:#050B10;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F14; --panel:#121920; --panel-2:#18212A; --ink:#E4E9EE; --ink-2:#A2AEBA; --ink-3:#7C8894; --line:#26313C; --line-2:#1D2630;
  --accent:#4E9BDB; --accent-soft:#12283A;
  --terran:#4E9BDB; --protoss:#E3B236; --zerg:#C07ACB;
  --min:#52B7EC; --gas:#5FC67C;
  --ok:#5CC487; --ok-soft:#12291D; --warn:#E3B04F; --warn-soft:#332611; --err:#F2786E; --err-soft:#3A1714;
  --navy:#050B10;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);
}
body[data-race="Terran"]{--accent:var(--terran)}
body[data-race="Protoss"]{--accent:var(--protoss)}
body[data-race="Zerg"]{--accent:var(--zerg)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-stretch:87.5%;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-stretch:87.5%;font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit;font-stretch:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;margin-inline:-16px;padding:8px 16px;border-bottom:3px solid var(--accent)}
.appbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#fff}
.brand img{width:28px;height:28px;object-fit:contain}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:#B9C6D2}
.crumb .title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .btn.ghost{color:#B9C6D2}
.crumb .btn.ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.savestate{font-size:12px;color:#B9C6D2;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7C8894;display:inline-block}
.dot.ok{background:#5CC487} .dot.busy{background:#E3B04F} .dot.bad{background:#F2786E}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;font-weight:600;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.danger{color:var(--err)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:15;background:var(--bg);padding-block:10px}
.strip>.wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0;text-align:left}
.meter .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.meter .val{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.meter .val small{font-size:14px;color:var(--ink-3);font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.meter.min .bar i{background:var(--min)} .meter.gas .bar i{background:var(--gas)}
.meter.over .bar i{background:var(--err)} .meter.over .val{color:var(--err)}
.gem{width:10px;height:10px;display:inline-block;transform:rotate(45deg);border-radius:2px;margin-right:4px}
.gem.min{background:var(--min)} .gem.gas{background:var(--gas);border-radius:50%;transform:none}
.status{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel-2);white-space:nowrap}
.chip.slot{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.uniq{border-color:var(--ink-2);color:var(--ink);background:transparent}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 156px);overflow:auto;padding-bottom:4px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.section{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);scroll-margin-top:156px;overflow:hidden}
.section>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:8px 14px;clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px))}
.section>header .step{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;background:var(--accent);color:#fff;padding:1px 8px}
.section>header h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.section>header .aside{margin-left:auto;font-size:12px;color:#B9C6D2}
.section>header .aside b{color:#fff}
.sbody{padding:14px 16px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);scroll-margin-top:156px;overflow:hidden}
.panel>h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;background:var(--navy);color:#fff;padding:6px 12px}
.panel>.pb{padding:12px}

.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:3px solid var(--accent);flex-wrap:wrap}
.tab{background:var(--panel-2);border:1px solid var(--line);border-bottom:0;padding:7px 22px 7px 16px;font-family:var(--display);font-stretch:87.5%;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 100%,0 100%)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl-s{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.input,select.input{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.race button{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:87.5%;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px 6px 8px;font-size:15px}
.race button img{width:30px;height:30px;object-fit:contain}
.race button[data-v="Terran"][aria-pressed="true"]{border-color:var(--terran);color:var(--terran)}
.race button[data-v="Protoss"][aria-pressed="true"]{border-color:var(--protoss);color:var(--protoss)}
.race button[data-v="Zerg"][aria-pressed="true"]{border-color:var(--zerg);color:var(--zerg)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.subhead .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel);text-align:left;display:flex;gap:10px;align-items:flex-start}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"],.tile[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tile .tcol{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.tile .t-name{font-weight:800;font-size:15px}
.tile .t-meta{display:flex;flex-wrap:wrap;gap:4px}
.tile .t-sub{font-size:12px;color:var(--ink-2)}
.tile .t-art{width:58px;height:58px;flex:none;border-radius:4px;background:radial-gradient(circle at 50% 45%,#2d4f6b,#0B1C29);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .t-art img{width:52px;height:52px;object-fit:contain}

.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2);background:var(--panel)}
.row:first-child{border-top:0}
.row.on{background:var(--accent-soft)}
.thumb{width:54px;height:46px;border-radius:4px;background:radial-gradient(circle at 50% 45%,#2d4f6b,#0B1C29);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.mini{background:var(--panel-2);border:1px solid var(--line-2)}
.row .r-name{font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .r-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;font-size:12px;color:var(--ink-2);align-items:center}
.row .r-ctl{display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:none;width:28px;height:28px;font-size:16px;line-height:1}
.stepper button:hover{background:var(--panel-2)}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.gascost{font-weight:800;color:var(--gas);white-space:nowrap;font-variant-numeric:tabular-nums}
.mincost{font-weight:800;color:var(--min);white-space:nowrap;font-variant-numeric:tabular-nums}
.expand{grid-column:1/-1;padding-top:6px}

.entries{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:6px;background:var(--panel);scroll-margin-top:156px;overflow:hidden}
.entry.has-err{border-color:var(--err)}
.entry-h{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;flex-wrap:wrap;border-left:5px solid var(--accent)}
.entry-h .thumb{width:48px;height:48px}
.entry-h .e-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.entry-h .e-cost{margin-left:auto;display:flex;align-items:center;gap:8px}
.entry-b{border-top:1px solid var(--line-2);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.comps{display:flex;flex-wrap:wrap;gap:6px}
.comps button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 10px;font-size:12px;text-align:left;display:flex;gap:8px;align-items:baseline}
.comps button b{font-family:var(--display);font-size:16px}
.comps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.upg{display:flex;flex-direction:column;gap:2px}
.upg label.u{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 8px;border-radius:4px;cursor:pointer}
.upg label.u:hover{background:var(--panel-2)}
.upg label.u.on{background:var(--accent-soft)}
.upg input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.u-name{font-weight:800;display:flex;gap:6px;flex-wrap:wrap;align-items:center;text-transform:uppercase;letter-spacing:.01em}
.u-desc{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.u-desc b{color:var(--ink)}
.tp{display:inline-block;font-weight:800;font-size:10px;color:#fff;padding:0 5px;border-radius:2px;line-height:1.6;letter-spacing:.02em}
.tp.Active{background:#36A9E0}.tp.Passive{background:#CD1619}.tp.Reaction{background:#CD9600}
.spec{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.spec select{padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.loadout{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:3px solid var(--accent);padding:6px 10px}
.picker{border:1px dashed var(--line);border-radius:6px;padding:10px;background:var(--panel-2)}
.pgroup+.pgroup{margin-top:10px}

.slots{display:flex;flex-direction:column;gap:8px}
.slotrow{display:grid;grid-template-columns:66px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.slotrow .sn{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:13px;height:13px;border:1.5px solid var(--ink-3);background:transparent;clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.pip.used{background:var(--accent);border-color:var(--accent)}
.pip.over{background:var(--err);border-color:var(--err)}
.slotrow .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.slotrow.bad .sc,.slotrow.bad .sn{color:var(--err)}
.src{font-size:11px;color:var(--ink-3);grid-column:2/-1;margin-top:-4px}

.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.4;padding:6px 8px;border-radius:3px;text-align:left;border:0;width:100%}
.check.error{background:var(--err-soft)} .check.warn{background:var(--warn-soft)} .check.info{background:var(--panel-2);color:var(--ink-2)}
.check .mk{width:9px;height:9px;margin-top:4px;transform:rotate(45deg)}
.check.error .mk{background:var(--err)} .check.warn .mk{background:var(--warn)} .check.info .mk{background:var(--ink-3)}
.check .ref{font-size:11px;color:var(--ink-3);white-space:nowrap}
.legal{font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.listhead h1{font-size:28px;text-transform:uppercase;letter-spacing:.05em}
.listhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.rcard .rc-top{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:10px 12px;clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px))}
.rcard .rc-top img{width:36px;height:36px;object-fit:contain;flex:none}
.rcard .rc-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;line-height:1.2;word-break:break-word;text-transform:uppercase}
.rcard .rc-fac{font-size:12px;color:#B9C6D2}
.rcard .rc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.rcard .rc-minis{display:flex;gap:2px;min-height:44px;align-items:flex-end;flex-wrap:wrap}
.rcard .rc-minis img{width:40px;height:44px;object-fit:contain}
.rcard .rc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.rcard .rc-stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.rcard .rc-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:4px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.notice.err{border-left-color:var(--err)}
.notice .grow{flex:1 1 260px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:6px;padding:22px;text-align:center;color:var(--ink-2)}
.importbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
textarea.input{min-height:74px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}

.sheetwrap{background:#fff;color:#09202E;border-radius:6px;padding:22px;margin-top:16px;box-shadow:var(--shadow);max-width:960px}

.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-top:16px}
.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.fmt{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.fmt.hero{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent),var(--shadow)}
.fmt .fh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.fmt .ext{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--navy);color:#fff;padding:3px 7px;min-width:52px;text-align:center;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.fmt .fn{font-weight:800;font-size:15px}
.fmt .fd{padding:8px 12px;font-size:13px;color:var(--ink-2);flex:1}
.fmt .fo{padding:0 12px 8px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.fmt .fo input{accent-color:var(--accent)}
.fmt .fa{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.preview{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;scroll-margin-top:160px}
.preview .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--navy);color:#fff;flex-wrap:wrap}
.preview .ph b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.preview .ph .btn{color:var(--ink)}
.preview pre{margin:0;padding:12px;max-height:520px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.preview .htmlbox{max-height:680px;overflow:auto;background:#D9DDE2}

.scrim{position:fixed;inset:0;background:rgba(4,10,16,.62);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 24px;overflow:auto}
.modal{max-width:1000px;width:100%;position:relative}
.modal .mclose{position:absolute;top:-6px;right:-6px;z-index:2;background:var(--navy);color:#fff;border:2px solid #fff;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}

@media (max-width:1020px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
}
@media (max-width:680px){
  .strip{position:static}
  .strip>.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.exhead{grid-template-columns:minmax(0,1fr)}
  .meter .val{font-size:18px}
  .savestate .txt{display:none}
  .sbody{padding:12px}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .r-ctl{grid-column:1/-1;justify-content:flex-end}
  .sheetwrap{padding:14px}
  .modal .mclose{top:4px;right:4px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
