<style id="card-css">.sc-card{--race:#005BA4;--race-2:#00548F;--race-3:#0A3F6B;--ink:#09202E;--paper:#EDEDED;--line:#C9CDD2;--gray:#6F6F6E;--active:#36A9E0;--passive:#CD1619;--reaction:#CD9600;--min:#1685C2;--gas:#2B8F48;
display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;font-family:'Noto Sans',Arial,sans-serif;font-stretch:75%;font-size:13.5px;line-height:1.38;box-shadow:0 1px 3px rgba(0,0,0,.18);break-inside:avoid;page-break-inside:avoid;text-align:left}
.sc-card[data-race=Protoss]{--race:#BD8A00;--race-2:#E0AE0A;--race-3:#6E5200}
.sc-card[data-race=Zerg]{--race:#823287;--race-2:#722F79;--race-3:#441C49}
.sc-card *{box-sizing:border-box}
.sc-card.sc-noart{grid-template-columns:minmax(0,1fr)}
.sc-art{background:#1a1a1a;position:relative;min-height:100%}
.sc-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;max-width:100%}
.sc-tacart{background:radial-gradient(circle at 50% 40%,var(--race-2),var(--race-3));display:flex;align-items:center;justify-content:center;padding:14px}
.sc-tacart img{height:auto;max-height:260px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.sc-body{display:flex;flex-direction:column;gap:9px;padding:0 0 12px;min-width:0}
.sc-title{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,var(--race-3),var(--race) 55%,var(--race-2));color:#fff;padding:10px 14px;clip-path:polygon(0 0,100% 0,100% 100%,18px 100%,0 calc(100% - 18px))}
.sc-tl{flex:1;min-width:0}
.sc-title h3{margin:0;font-family:'Saira','Noto Sans',Arial,sans-serif;font-stretch:87.5%;font-weight:600;font-size:25px;line-height:1.05;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.sc-meta em{font-style:normal;opacity:.78;font-weight:600}
.sc-uq{background:#fff;color:var(--ink);padding:0 6px;border-radius:2px}
.sc-gas{background:var(--gas);color:#fff;padding:0 6px;border-radius:2px}
.sc-emb{width:46px;height:46px;object-fit:contain;flex:none;background:rgba(255,255,255,.92);border-radius:50%;padding:5px}
.sc-res{background:#fff;color:var(--race-3);font-weight:800;font-size:14px;padding:3px 9px;border-radius:3px;flex:none}
.sc-statrow,.sc-sec,.sc-fielded,.sc-upband,.sc-upw,.sc-foot,.sc-fine{margin-inline:12px}
.sc-statrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.sc-stats{display:flex;gap:4px;flex-wrap:wrap}
.sc-st{display:flex;flex-direction:column;align-items:center;min-width:52px}
.sc-st span{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--gray)}
.sc-st b{background:var(--race);color:#fff;font-family:'Saira','Noto Sans',sans-serif;font-weight:700;font-size:21px;min-width:52px;text-align:center;padding:1px 6px;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.sc-st.sc-sh b{background:#2A8FD0}
.sc-sup{border-collapse:collapse;font-size:12px;margin-left:auto;background:#fff}
.sc-sup th{background:var(--gray);color:#fff;font-size:10px;letter-spacing:.06em;padding:2px 8px;font-weight:700}
.sc-sup td{border:1px solid var(--line);text-align:center;padding:1px 8px;font-variant-numeric:tabular-nums}
.sc-fielded{background:#fff;border:1px solid var(--line);padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em}

/* ================= BASE ================= */
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--bg-img);background-attachment:fixed;color:var(--ink);font:14px/1.45 var(--body);font-stretch:87.5%;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased;min-height:100%}

button,input,select,textarea{font:inherit;color:inherit;font-stretch:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);margin-inline:-16px;padding:8px 16px 10px;position:sticky}

.appbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.brand img{width:30px;height:30px;object-fit:contain}
.brand span b{color:var(--accent);font-weight:700}

.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:var(--hdr-sub)}
.crumb .title{font-weight:700;color:var(--hdr-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .btn.ghost{color:var(--hdr-sub)}
.crumb .btn.ghost:hover{background:rgba(255,255,255,.08);color:var(--hdr-ink)}

.modes{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden}

.modes button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--hdr-ink)}

.btn.danger{color:var(--err)}

.meter.over .bar i{background:var(--err)} .meter.over .val{color:var(--err)}
.gem{width:10px;height:10px;display:inline-block;transform:rotate(45deg);border-radius:2px;margin-right:4px}
.gem.min{background:var(--min)} .gem.gas{background:var(--gas);border-radius:50%;transform:none}
.status{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:min(var(--r),6px);border:1px solid var(--line);color:var(--ink-2);background:var(--panel-2);white-space:nowrap}
.chip.slot{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.uniq{border-color:var(--ink-2);color:var(--ink);background:transparent}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 144px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 160px);overflow:auto;padding-bottom:4px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.section,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sec);box-shadow:var(--glow);scroll-margin-top:160px;overflow:hidden}
.section>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--deco) right center/max(var(--deco-w),110px) 100% no-repeat,linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:9px calc(14px + var(--deco-w)) 9px 14px;clip-path:var(--cut);border-bottom:2px solid var(--accent)}
.section>header .step{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:min(var(--r),10px)}
.section>header h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.section>header .aside{margin-left:auto;font-size:12px;color:var(--hdr-sub)}
.section>header .aside b{color:var(--hdr-ink)}
.sbody{padding:14px 16px 16px}
.panel>h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:7px 12px;border-bottom:2px solid var(--accent)}
.panel>.pb{padding:12px}

.tabbar{display:flex;align-items:flex-end;gap:10px;margin-top:14px;border-bottom:3px solid var(--accent);flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:var(--panel-2);border:1px solid var(--line);border-bottom:0;padding:7px 22px 7px 16px;font-family:var(--display);font-stretch:87.5%;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);clip-path:var(--tabcut);border-radius:var(--r) var(--r) 0 0}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.viewsw{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:5px;font-size:12px;color:var(--ink-2);font-weight:600}
.viewsw .seg button{padding:3px 10px;font-size:12px;display:flex;gap:5px;align-items:center}
.viewsw svg{width:14px;height:14px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl-s{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.input,select.input{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.race button{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:87.5%;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px 6px 8px;font-size:15px}
.race button img{width:30px;height:30px;object-fit:contain}
.race button[data-v="Terran"][aria-pressed="true"]{border-color:var(--terran);color:var(--terran)}
.race button[data-v="Protoss"][aria-pressed="true"]{border-color:var(--protoss);color:var(--protoss)}
.race button[data-v="Zerg"][aria-pressed="true"]{border-color:var(--zerg);color:var(--zerg)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.subhead .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}

/* tiles (faction, creep, missions) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;background:var(--panel);text-align:left;display:flex;gap:10px;align-items:flex-start}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"],.tile[aria-checked="true"]{border-color:var(--accent);box-shadow:var(--sel-glow);background:var(--accent-soft)}
.tile .tcol{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.tile .t-name{font-weight:800;font-size:15px}
.tile .t-meta{display:flex;flex-wrap:wrap;gap:4px}
.tile .t-sub{font-size:12px;color:var(--ink-2)}
.art-bg{background:radial-gradient(circle at 50% 45%,#2d4f6b,#0B1C29)}
[data-skin="Protoss"] .art-bg{background:radial-gradient(circle at 50% 45%,#3a7fa8,#1c2a3a)}
[data-skin="Zerg"] .art-bg{background:radial-gradient(circle at 50% 45%,#5b2862,#1d0b20)}
.dtile{flex-direction:column;gap:8px}
.dtile .d-map{display:block;width:100%;border-radius:min(var(--r),8px);overflow:hidden;background:#EDEDED;aspect-ratio:1.39;border:1px solid var(--line-2)}
.dtile .d-map img{display:block;width:100%;height:100%;object-fit:cover}
.dmodal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.dm-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:30px}
.dm-head h2{font-size:24px;text-transform:uppercase}
.dm-other summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:4px 0}
.dm-other[open] summary{margin-bottom:8px}
.tile .t-art{width:58px;height:58px;flex:none;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .t-art img{width:52px;height:52px;object-fit:contain}

/* rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2);background:var(--panel)}
.row:first-child{border-top:0}
.row.on{background:var(--accent-soft)}
.thumb{width:54px;height:46px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.mini{background:var(--tile-bg);border:1px solid var(--line-2)}
.row .r-name{font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .r-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;font-size:12px;color:var(--ink-2);align-items:center}
.row .r-ctl{display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:none;width:28px;height:28px;font-size:16px;line-height:1}
.stepper button:hover{background:var(--panel-2)}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.gascost{font-weight:800;color:var(--gas);white-space:nowrap;font-variant-numeric:tabular-nums}
.mincost{font-weight:800;color:var(--min);white-space:nowrap;font-variant-numeric:tabular-nums}
.expand{grid-column:1/-1;padding-top:6px}

/* unit entries (list layout) */
.entries{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);scroll-margin-top:160px;overflow:hidden}
.entry.has-err{border-color:var(--err)}
.entry-h{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;flex-wrap:wrap;border-left:5px solid var(--accent)}
.entry-h .thumb{width:48px;height:48px}
.entry-h .e-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.entry-h .e-cost{margin-left:auto;display:flex;align-items:center;gap:8px}
.entry-b{border-top:1px solid var(--line-2);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.comps{display:flex;flex-wrap:wrap;gap:6px}
.comps button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 10px;font-size:12px;text-align:left;display:flex;gap:8px;align-items:baseline}
.comps button b{font-family:var(--display);font-size:16px}
.comps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.upg{display:flex;flex-direction:column;gap:2px}
.upg label.u{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 8px;border-radius:var(--r);cursor:pointer}
.upg label.u:hover{background:var(--panel-2)}
.upg label.u.on{background:var(--accent-soft)}
.upg input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.u-name{font-weight:800;display:flex;gap:6px;flex-wrap:wrap;align-items:center;text-transform:uppercase;letter-spacing:.01em}
.u-desc{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.u-desc b{color:var(--ink)}
.tp{display:inline-block;font-weight:800;font-size:10px;color:#fff;padding:0 5px;border-radius:2px;line-height:1.6;letter-spacing:.02em}
.tp.Active{background:#36A9E0}.tp.Passive{background:#CD1619}.tp.Reaction{background:#CD9600}
.spec{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.spec select{padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.loadout{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 var(--r) var(--r) 0}
.picker{border:1px dashed var(--line);border-radius:var(--r-lg);padding:10px;background:var(--panel-2)}
.pgroup+.pgroup{margin-top:10px}

/* ================= TILE LAYOUT ================= */
.utiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.utile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--glow);min-width:0;scroll-margin-top:160px}
.utile.open{border-color:var(--accent);box-shadow:var(--sel-glow)}
.utile.has-err{border-color:var(--err)}
.utile.on{border-color:var(--accent)}
.ut-img{position:relative;height:138px;background:var(--tile-bg);display:flex;align-items:flex-end;justify-content:center;border:0;padding:0;width:100%;border-bottom:3px solid var(--accent)}
.ut-img img{height:128px;width:auto;max-width:92%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ut-img.card img{height:112px;margin-bottom:12px}
.ut-img.art-bg{border-bottom-color:var(--accent)}
.ut-tl{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.ut-tr{position:absolute;top:6px;right:6px;background:var(--panel);border-radius:var(--r);padding:1px 7px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-size:13px}
.ut-body{padding:8px 10px 6px;display:flex;flex-direction:column;gap:4px;flex:1}
.ut-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:16px;line-height:1.15;text-transform:uppercase;letter-spacing:.02em}
.ut-meta{font-size:12px;color:var(--ink-2)}
.ut-ups{display:flex;flex-wrap:wrap;gap:3px}
.ut-ups span{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:min(var(--r),6px)}
.ut-err{font-size:11.5px;color:var(--err);font-weight:700}
.ut-act{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px 10px;align-items:center}
.ut-act .grow{flex:1}
.ut-editor{grid-column:1/-1}
.ut-editor .entry{border-color:var(--accent);box-shadow:var(--sel-glow)}
.ttile .ut-img{height:118px}

/* slots */
.slots{display:flex;flex-direction:column;gap:8px}
.slotrow{display:grid;grid-template-columns:66px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.slotrow .sn{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:13px;height:13px;border:1.5px solid var(--ink-3);background:transparent;clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
[data-skin="Protoss"] .pip{clip-path:none;border-radius:50%}
[data-skin="Zerg"] .pip{clip-path:none;border-radius:50% 50% 50% 10%}
.pip.used{background:var(--accent);border-color:var(--accent)}
.pip.over{background:var(--err);border-color:var(--err)}
.slotrow .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.slotrow.bad .sc,.slotrow.bad .sn{color:var(--err)}
.src{font-size:11px;color:var(--ink-3);grid-column:2/-1;margin-top:-4px}

/* checks */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.4;padding:6px 8px;border-radius:var(--r);text-align:left;border:0;width:100%;color:inherit}
.check.error{background:var(--err-soft)} .check.warn{background:var(--warn-soft)} .check.info{background:var(--panel-2);color:var(--ink-2)}
.check .mk{width:9px;height:9px;margin-top:4px;transform:rotate(45deg)}
.check.error .mk{background:var(--err)} .check.warn .mk{background:var(--warn)} .check.info .mk{background:var(--ink-3)}
.check .ref{font-size:11px;color:var(--ink-3);white-space:nowrap}
.legal{font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

/* list view */
.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.listhead h1{font-size:28px;text-transform:uppercase;letter-spacing:.05em}
.listhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.examples{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 16px;font-size:13px;color:var(--ink-2)}
.examples button{display:inline-flex;align-items:center;gap:6px}
.examples img{width:18px;height:18px;object-fit:contain}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sec);display:flex;flex-direction:column;box-shadow:var(--glow);overflow:hidden;color:var(--ink)}
.rcard .rc-top{position:relative;display:flex;align-items:center;gap:10px;background:var(--deco) right center/max(var(--deco-w-sm),90px) 100% no-repeat,linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:10px calc(12px + var(--deco-w-sm)) 12px 12px;clip-path:var(--cut)}
.rcard .rc-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stripe)}
.rcard .rc-top img{width:36px;height:36px;object-fit:contain;flex:none}
.rcard .rc-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;line-height:1.2;word-break:break-word;text-transform:uppercase}
.rcard .rc-fac{font-size:12px;color:var(--hdr-sub)}
.rcard .rc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;background:var(--bg-img),var(--panel);background-blend-mode:normal}
.rcard .rc-minis{display:flex;gap:2px;min-height:44px;align-items:flex-end;flex-wrap:wrap}
.rcard .rc-minis img{width:40px;height:44px;object-fit:contain}
.rcard .rc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.rcard .rc-stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.rcard .rc-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.notice.err{border-left-color:var(--err)}
.notice .grow{flex:1 1 260px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:22px;text-align:center;color:var(--ink-2);background:var(--panel)}
.importbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
textarea.input{min-height:74px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}

.sheetwrap{background:#fff;color:#09202E;border-radius:var(--r-lg);padding:22px;margin-top:16px;box-shadow:var(--glow);max-width:960px}

/* export */
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-top:16px}
.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.fmt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--glow)}
.fmt.hero{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent),var(--glow)}
.fmt .fh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.fmt .ext{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--hdr);color:var(--hdr-ink);padding:3px 7px;min-width:52px;text-align:center;border-radius:min(var(--r),6px)}
.fmt .fn{font-weight:800;font-size:15px}
.fmt .fd{padding:8px 12px;font-size:13px;color:var(--ink-2);flex:1}
.fmt .fo{padding:0 12px 8px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.fmt .fo input{accent-color:var(--accent)}
.fmt .fa{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.preview{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;scroll-margin-top:160px}
.preview .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);flex-wrap:wrap}
.preview .ph b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.preview .ph .btn{color:var(--ink)}
.preview pre{margin:0;padding:12px;max-height:520px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.preview .htmlbox{max-height:680px;overflow:auto;background:#D9DDE2}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,10,16,.62);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 24px;overflow:auto}
.modal{max-width:1000px;width:100%;position:relative}
.modal .mclose{position:absolute;top:-6px;right:-6px;z-index:2;background:var(--hdr);color:var(--hdr-ink);border:2px solid #fff;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}

@media (max-width:1020px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
}
@media (max-width:680px){
  .strip{position:static;background:none}
  .strip>.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.exhead{grid-template-columns:minmax(0,1fr)}
  .meter .val{font-size:18px}
  .savestate .txt,.modes .ml{display:none}
  .crumb{order:5;flex-basis:100%}
  .sbody{padding:12px}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .r-ctl{grid-column:1/-1;justify-content:flex-end}
  .sheetwrap{padding:14px}

(function (root) {

  var SCALES = {
    skirmish: { id: "skirmish", name: "Skirmish", minerals: 1000, battlefield: "36\" × 36\"", side: "skirmish" },

    this.cards = {};

  Core.SCALES = SCALES;

  }

  function phaseHead(p, label) {
    return '<div class="sc-ph"><span class="sc-phtab">' + (ICON[p] ? '<i class="sc-ico">' + ICON[p] + "</i>" : "") + esc(PHASE_NAME[p].toUpperCase()) + "</span>" + (label ? '<span class="sc-phx">' + esc(label) + "</span>" : "") + "</div>";
  }

  /* ---------- UNIT CARD ---------- */
  function unitCardHTML(C, u, entry, src) {
    src = src || identity;
    var st = u.stats, lo = entry ? C.loadout(entry) : null, comp = entry ? C.composition(entry) : null;
    var takenNames = {}; if (entry) entry.upgrades.forEach(function (n) { takenNames[n] = true; });
    var artSrc = src(ART.unit(u.id)), emb = src(ART.race(u.race));
    var h = '<article class="sc-card' + (artSrc ? "" : " sc-noart") + '" data-race="' + esc(u.race) + '">';
    if (artSrc) h += '<div class="sc-art"><img src="' + esc(artSrc) + '" alt="' + esc(u.name) + ' miniatures" loading="lazy"></div>';
    h += '<div class="sc-body">';
    // title bar
    h += '<header class="sc-title"><div class="sc-tl"><h3>' + esc(u.name.toUpperCase()) + "</h3>" +
      '<div class="sc-meta">' + (u.army_slot ? '<span><em>ARMY SLOT:</em> ' + esc(u.army_slot.toUpperCase()) + "</span>" : '<span><em>SUMMONED UNIT</em></span>') +
      '<span><em>COMBAT ROLE:</em> ' + esc(String(u.combat_role).toUpperCase()) + "</span>" + (u.unique ? '<span class="sc-uq">UNIQUE</span>' : "") + "</div></div>" +
      (emb ? '<img class="sc-emb" src="' + esc(emb) + '" alt="" loading="lazy">' : "") + "</header>";
    // stats + supply
    var stats = [["SPEED", st.speed], ["ARMOUR", st.armour], ["EVADE", st.evade], ["HIT POINTS", st.hp]];
    if (st.shield != null) stats.push(["SHIELD", st.shield]);
    stats.push(["SIZE", st.size]);
    h += '<div class="sc-statrow"><div class="sc-stats">' + stats.map(function (s) { return '<div class="sc-st' + (s[0] === "SHIELD" ? " sc-sh" : "") + '"><span>' + s[0] + "</span><b>" + esc(s[1]) + "</b></div>"; }).join("") + "</div>";
    h += '<table class="sc-sup"><thead><tr><th colspan="' + u.supply_profile.length + '">MODELS / SUPPLY</th></tr></thead><tbody><tr>' +
      u.supply_profile.map(function (b) { return "<td>" + esc(b.models) + "</td>"; }).join("") + "</tr><tr>" +
      u.supply_profile.map(function (b) { return "<td><b>" + b.supply + "</b></td>"; }).join("") + "</tr></tbody></table></div>";
    if (entry && comp) {
      var c = C.entryCost(entry);
      h += '<div class="sc-fielded">FIELDED: <b>' + entry.models + " MODELS</b> · SUPPLY <b>" + c.supply + '</b> · <span class="sc-min">' + c.total + " MINERALS</span>" + (c.upgrades ? " (" + c.base + " + " + c.upgrades + " upgrades)" : "") + "</div>";
    }
    // phases
    PHASES.forEach(function (p) {
      var ws = u.weapons.filter(function (w) { return w.phase === p; });
      var ab = u.abilities.filter(function (a) { return a.phase === p; });
      if (!ws.length && !ab.length) return;
      h += '<section class="sc-sec">' + phaseHead(p);
      h += ab.map(function (a) { return abilityBox(a); }).join("");
      h += weaponTable(ws, { replaced: lo ? lo.replaced : null });
      h += "</section>";
    });
    // upgrades
    if (u.upgrades.length) {
      h += '<div class="sc-upband">&#9650; UPGRADES</div>';
      PHASES.forEach(function (p) {
        var ups = u.upgrades.filter(function (x) { return x.phase === p; });
        if (!ups.length) return;
        h += '<section class="sc-sec">' + phaseHead(p, "UPGRADE");
        ups.forEach(function (x) {
          var costText = (x.cost_by_composition || []).map(function (v, i) { return v + (u.compositions.length > 1 ? " (" + u.compositions[i].models + ")" : ""); }).join(" / ");
          if (comp && x.cost_by_composition) costText = x.cost_by_composition[comp.index] + " MINERALS";
          var sp = entry && entry.specialists && entry.specialists[x.name];
          if (x.kind === "weapon") {
            var costs = {}, taken = {}, spec = {}; costs[x.name] = costText; taken[x.name] = !!takenNames[x.name]; if (sp) spec[x.name] = sp;
            h += '<div class="sc-upw' + (takenNames[x.name] ? " sc-taken" : "") + '"><span class="sc-uptag">UPGRADE' + (x.specialist ? " · SPECIALIST" : "") + (takenNames[x.name] ? " · TAKEN" : "") + "</span>" +
              weaponTable([x], { costs: costs, specialist: spec }) + "</div>";
          } else {
            h += abilityBox(x, { upgrade: true, taken: !!takenNames[x.name], costText: costText + (takenNames[x.name] ? " · TAKEN" : "") });
          }
        });
        h += "</section>";
      });
    }
    // footer
    h += '<footer class="sc-foot"><span><em>COMBAT TAGS:</em> ' + esc(u.combat_tags.join(", ").toUpperCase()) + "</span>" +
      '<span class="sc-ftags">' + u.faction_tags.map(function (t) { return '<i>' + esc(t.toUpperCase()) + "</i>"; }).join("") + "</span></footer>";
    var fine = []; if (u.base_mm) fine.push("Base Ø " + u.base_mm + (typeof u.base_mm === "number" ? "mm" : ""));
    if (u.card_version) fine.push("Card " + u.card_version);
    if (u.compositions && u.compositions.length) fine.push("Cost table: " + u.compositions.map(function (c) { return c.models + " models " + c.minerals + " / Supply " + c.supply; }).join(" · "));
    (u.corrections || []).forEach(function (x) { fine.push("Corrected: " + x); });
    (u.notes || []).forEach(function (x) { fine.push("Note: " + x); });
    h += '<div class="sc-fine">' + fine.map(esc).join("<br>") + "</div>";
    h += "</div></article>";
    return h;
  }

  /* ---------- TACTICAL / FACTION / CREEP CARD ---------- */
  function slotsText(slots) {
    var k = Object.keys(slots);
    return k.length ? k.map(function (s) { return slots[s] + " × " + s.toUpperCase(); }).join(", ") : "-";
  }
  function tacCardHTML(C, c, src, count) {
    src = src || identity;
    var artSrc = src(ART.card(c.id));
    var h = '<article class="sc-card sc-tac' + (artSrc ? "" : " sc-noart") + '" data-race="' + esc(c.race) + '">';
    if (artSrc) h += '<div class="sc-art sc-tacart"><img src="' + esc(artSrc) + '" alt="" loading="lazy"></div>';
    h += '<div class="sc-body"><header class="sc-title"><div class="sc-tl"><h3>' + esc(c.name.toUpperCase()) + (count > 1 ? " ×" + count : "") + "</h3>" +
      '<div class="sc-meta"><span><em>' + esc(c.kind.toUpperCase()) + " CARD</em></span>" + (c.unique ? '<span class="sc-uq">UNIQUE</span>' : "") +
      (c.gas_cost != null && c.kind !== "Faction" ? '<span class="sc-gas">' + c.gas_cost + " VESPENE GAS</span>" : "") + "</div></div>" +
      (c.resource && c.resource.value != null ? '<span class="sc-res">' + esc(c.resource.type) + ": " + esc(c.resource.value) + "</span>" : "") + "</header>";
    PHASES.forEach(function (p) {
      var ab = c.abilities.filter(function (a) { return a.phase === p; });
      if (!ab.length) return;
      h += '<section class="sc-sec">' + phaseHead(p) + ab.map(function (a) { return abilityBox(a); }).join("") + "</section>";
    });
    h += '<footer class="sc-foot"><span><em>SUPPLY:</em> ' + esc(slotsText(c.slots)) + '</span><span class="sc-ftags">' + c.faction_tags.map(function (t) { return "<i>" + esc(t.toUpperCase()) + "</i>"; }).join("") + "</span></footer>";
    var fine = []; if (c.card_version) fine.push("Card " + c.card_version);
    (c.corrections || []).forEach(function (x) { fine.push("Corrected: " + x); });
    (c.notes || []).forEach(function (x) { fine.push("Note: " + x); });
    if (fine.length) h += '<div class="sc-fine">' + fine.map(esc).join("<br>") + "</div>";
    return h + "</div></article>";
  }

  /* ---------- MISSION CARD (text) ---------- */
  function missionCardHTML(m, side) {
    var s = m[side];
    var lines = s.mission_parameters.map(function (x) { return "<p>" + richText(x) + "</p>"; }).join("");
    var sc = s.scoring.map(function (x) { return "<p>" + richText(x) + "</p>"; }).join("");
    var ad = (s.additional || []).map(function (x) { return "<p>" + richText(x) + "</p>"; }).join("");
    if (s.special_win_lead) ad += "<p><b>SPECIAL WINNING CONDITIONS:</b> The game ends immediately if a <b>Player</b> leads <b>by " + s.special_win_lead + "+ VPs</b>.</p>";
    return '<article class="sc-mission"><header><h3>' + esc(m.name.toUpperCase()) + '</h3><span class="sc-mbox"><b>' + s.deploy_supply + '</b>SUPPLY</span><span class="sc-mbox"><b>+' + s.supply_per_round + "</b>PER ROUND</span></header>" +
      '<div class="sc-mlen">GAME LENGTH: <b>' + s.game_length + "</b> · " + (side === "skirmish" ? "SKIRMISH LEVEL" : "STANDARD ENGAGEMENT") + "</div>" +
      '<div class="sc-mblk"><span>MISSION PARAMETERS:</span>' + lines + '</div><div class="sc-mblk"><span>SCORING CONDITIONS:</span>' + sc + "</div>" +
      (ad ? '<div class="sc-mblk"><span>ADDITIONAL CONDITIONS:</span>' + ad + "</div>" : "") + "</article>";
  }

  /* ---------- DEPLOYMENT CARD (image of the printed map, one side) ---------- */
  function deploymentCardHTML(d, side, src) {
    src = src || identity;
    var p = src(ART.deploy(d.id, side)), label = d[side] + (side === "skirmish" ? " · Skirmish Level 36\u2033 × 36\u2033" : " · Standard Engagement 54\u2033 × 36\u2033");
    if (!p) return '<article class="sc-deploy sc-deploy-text"><h3>' + esc(d[side].toUpperCase()) + '</h3><p>' + esc(label) + '</p></article>';
    return '<figure class="sc-deploy"><img src="' + esc(p) + '" alt="Deployment map: ' + esc(label) + '" loading="lazy"><figcaption>' + esc(label) + "</figcaption></figure>";
  }

  /* ---------- ROSTER SHEET (Organized Play fields) ---------- */
  function sheetHTML(C, r, src, opts) {
    src = src || identity; opts = opts || {};
    var f = C.faction(r), t = C.totals(r), lim = C.limits(r), side = lim.scale.side, v = C.validate(r);
    var errs = v.filter(function (x) { return x.level === "error"; });
    var remb = r.race && opts.art !== false ? src(ART.race(r.race)) : "";
    var h = '<div class="rs"><header class="rs-h">' + (remb ? '<img class="rs-emb" src="' + esc(remb) + '" alt="">' : "") +
      '<div><div class="rs-k">ARMY ROSTER</div><h2>' + esc(r.name || "Roster") + "</h2></div>" +
      '<div class="rs-status ' + (errs.length ? "bad" : "ok") + '">' + (errs.length ? errs.length + " RULES ISSUE" + (errs.length > 1 ? "S" : "") : "LEGAL") + "</div></header>";
    h += '<div class="rs-grid"><div><span>PLAYER</span><b>' + esc(r.player || "—") + "</b></div><div><span>FACTION</span><b>" + esc((r.race || "—") + (f ? " · " + f.name : "")) + "</b></div>" +
      "<div><span>ENGAGEMENT</span><b>" + esc(lim.scale.name) + "</b></div><div><span>MINERALS</span><b>" + fmt(t.minerals) + " / " + fmt(lim.minerals) + "</b></div>" +
      "<div><span>VESPENE GAS</span><b>" + fmt(t.gas) + " / " + fmt(lim.gas) + "</b></div><div><span>TOTAL SUPPLY</span><b>" + t.supply + "</b></div></div>";
    h += '<h4 class="rs-sh">UNITS</h4><div class="rs-tw"><table class="rs-t"><thead><tr>' + (opts.art !== false ? "<th></th>" : "") + '<th>Unit</th><th>Loadout &amp; upgrades</th><th class="n">Supply</th><th class="n">Minerals</th></tr></thead><tbody>';
    r.units.forEach(function (e) {
      var u = C.units[e.unitId]; if (!u) return; var c = C.entryCost(e);
      h += "<tr>" + (opts.art !== false ? '<td class="rs-mini"><img src="' + esc(src(ART.mini(u.id))) + '" alt="" loading="lazy"></td>' : "") +
        "<td><b>" + esc(u.name) + '</b><br><span class="rs-f">' + e.models + " model" + (e.models > 1 ? "s" : "") + " · " + esc(u.army_slot) + "</span></td><td>" + esc(C.loadoutText(e)) +
        '</td><td class="n">' + c.supply + '</td><td class="n">' + c.total + (c.upgrades ? '<br><span class="rs-f">' + c.base + " + " + c.upgrades + "</span>" : "") + "</td></tr>";
    });
    h += '</tbody><tfoot><tr><td colspan="' + (opts.art !== false ? 3 : 2) + '">Total</td><td class="n">' + t.supply + '</td><td class="n">' + fmt(t.minerals) + " / " + fmt(lim.minerals) + "</td></tr></tfoot></table></div>";
    h += '<h4 class="rs-sh">TACTICAL CARDS</h4><div class="rs-tw"><table class="rs-t"><thead><tr><th>Card</th><th>Army Slots</th><th class="n">Vespene Gas</th></tr></thead><tbody>';
    if (f) h += "<tr><td><b>" + esc(f.name) + '</b> <span class="rs-f">Faction Card</span></td><td>' + esc(slotsText(f.slots)) + '</td><td class="n">—</td></tr>';
    Object.keys(r.tactical || {}).forEach(function (id) {
      var c = C.cards[id], n = r.tactical[id]; if (!c || !n) return;
      var sl = {}; Object.keys(c.slots).forEach(function (s) { sl[s] = c.slots[s] * n; });
      h += "<tr><td>" + esc(c.name) + (n > 1 ? " ×" + n : "") + "</td><td>" + esc(slotsText(sl)) + '</td><td class="n">' + c.gas_cost * n + "</td></tr>";
    });
    if (r.creepId && C.cards[r.creepId]) h += "<tr><td>" + esc(C.cards[r.creepId].name) + ' <span class="rs-f">Creep Card</span></td><td>—</td><td class="n">' + C.cards[r.creepId].gas_cost + "</td></tr>";
    h += '</tbody><tfoot><tr><td colspan="2">Total</td><td class="n">' + t.gas + " / " + lim.gas + "</td></tr></tfoot></table></div>";
    h += '<h4 class="rs-sh">MISSION &amp; DEPLOYMENT CARDS</h4><div class="rs-tw"><table class="rs-t"><tbody><tr><td class="rs-f" style="width:170px">Mission Cards</td><td>' +
      ((r.missions || []).map(function (id) { return esc(C.missions[id] ? C.missions[id].name : id); }).join(", ") || "—") + '</td></tr><tr><td class="rs-f">Deployment Cards</td><td>' +
      ((r.deployments || []).map(function (id) { return esc(C.deployments[id] ? C.deployments[id][side] : id); }).join(", ") || "—") + "</td></tr></tbody></table></div>";
    if (opts.checks && errs.length) h += '<div class="rs-issues"><b>Rules issues</b><ul>' + errs.map(function (x) { return "<li>" + esc(x.msg) + " <i>" + esc(x.ref) + "</i></li>"; }).join("") + "</ul></div>";
    return h + "</div>";
  }

  return mq && mq.matches ? "dark" : "light";
}
function applyMode(){
  document.body.setAttribute("data-mode", effectiveMode());
  var m = $("modes"); if(m) m.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-v")===P.mode)); });
}
if(mq){ if(mq.addEventListener) mq.addEventListener("change", applyMode); else if(mq.addListener) mq.addListener(applyMode); }
try{ new MutationObserver(applyMode).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]}); }catch(e){}

/* ------------ storage: private db subtree, browser fallback ------------ */
var Store = {
  mode:"loading", col:null, pending:{}, inflight:{}, timers:{}, unsub:null, LS_KEY:"scmuster.rosters.v1",
  lsRead:function(){ try{ var v = JSON.parse(localStorage.getItem(this.LS_KEY)||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } },
  lsWrite:function(list){ try{ localStorage.setItem(this.LS_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } },
  init:function(){
    var self = this, settled = false;
    function useLocal(){ if(settled) return; settled = true; if(self.unsub){ try{ self.unsub(); }catch(e){} self.unsub=null; } self.mode="local"; S.store="local"; S.rosters = self.lsRead(); afterLoad(); }
    var cl = window.claude;
    if(!cl || typeof cl.use !== "function"){ useLocal(); return; }
    Promise.all([cl.use("db"), cl.use("user")]).then(function(res){
      var db = res[0], user = res[1];
      if(!db || !user){ useLocal(); return; }
      return user.id().then(function(id){
        if(!id){ useLocal(); return; }
        try{ self.col = db.doc("data/users/"+id+"/profile").collection("rosters"); }catch(e){ useLocal(); return; }
        if(settled) return;
        var first = true;
        self.unsub = self.col.onSnapshot(function(snap){
          if(first && settled) return;
          if(first){ self.mode="db"; S.store="db"; }
          var list = snap.docs.map(function(d){ return clone(d.data()); });
          S.rosters = list;
          if(S.cur && !S.cur.isExample && !self.busy(S.cur.id)){
            var remote = list.filter(function(r){return r.id===S.cur.id;})[0];
            if(remote && remote.updatedAt > S.cur.updatedAt){ S.cur = remote; if(S.view==="build") render(); }
          }
          if(first){ first=false; settled=true; afterLoad(); } else if(S.view==="list") render();
        }, function(err){ self.fail(err); if(!settled) useLocal(); });
      });
    }).catch(function(){ useLocal(); });
    setTimeout(useLocal, 12000);
  },
  busy:function(id){ return !!(this.pending[id]||this.inflight[id]||this.timers[id]); },
  queue:function(r){
    var self = this; r.updatedAt = Date.now(); this.pending[r.id] = clone(r);
    clearTimeout(this.timers[r.id]); setSave("saving");
    this.timers[r.id] = setTimeout(function(){ delete self.timers[r.id]; self.flush(r.id); }, 600);
    upsertList(r);
  },
  flush:function(id){
    var self = this;
    if(this.inflight[id]){ return this.inflight[id].then(function(){ return self.flush(id); }); }
    var body = this.pending[id]; if(!body) return Promise.resolve();
    delete this.pending[id];
    var p = this.write(body).catch(function(e){
      if(e && e.code==="unavailable") return new Promise(function(r){setTimeout(r,700+Math.random()*600);}).then(function(){ return self.write(body); });
      throw e;
    }).then(function(){ delete self.inflight[id]; if(!self.anyBusy()) setSave(self.mode==="db"?"saved":"local"); },
            function(e){ delete self.inflight[id]; self.fail(e); });
    this.inflight[id] = p; return p;
  },
  anyBusy:function(){ return Object.keys(this.pending).length+Object.keys(this.inflight).length+Object.keys(this.timers).length>0; },
  write:function(r){
    if(this.mode==="db") return this.col.doc(r.id).set(r);
    var list = this.lsRead().filter(function(x){return x.id!==r.id;}); list.push(r);
    return this.lsWrite(list) ? Promise.resolve() : Promise.reject({code:"local_full"});
  },
  remove:function(id){
    clearTimeout(this.timers[id]); delete this.timers[id]; delete this.pending[id];
    S.rosters = S.rosters.filter(function(r){return r.id!==id;});
    if(this.mode==="db") return this.col.doc(id).delete().catch(this.fail.bind(this));
    this.lsWrite(this.lsRead().filter(function(x){return x.id!==id;})); return Promise.resolve();
  },
  fail:function(e){
    setSave("error");
    var msg = e && e.code==="quota_exceeded" ? "Storage is full. Delete rosters you no longer need, then try again."
      : e && (e.code==="revoked"||e.code==="not_granted") ? "Saving is not available in this view. Export your roster to keep it."
      : e && e.code==="local_full" ? "This browser refused to store the roster. Export it to keep a copy."
      : "A save did not go through. Your changes are still on screen; make another edit to retry, or export the roster.";
    S.notice = {kind:"err", text:msg}; render();
  }
};
function upsertList(r){ var i = S.rosters.findIndex(function(x){return x.id===r.id;}); var c = clone(r); if(i===-1) S.rosters.push(c); else S.rosters[i]=c; }
function setSave(s){ S.save = s; renderSaveState(); }

function setRace(race){
  var r = S.cur; if(r.race===race) return;
  var loses = r.units.length + Object.keys(r.tactical).length + (r.creepId?1:0);
  if(r.race && loses && S.confirmRace!==race){ S.confirmRace = race; render(); return; }
  S.confirmRace=null; r.race = race; r.factionId = null; r.tactical = {}; r.creepId = null; r.units = []; commit();
}
function setFaction(id){
  var r = S.cur; if(r.factionId===id) return;
  r.factionId = id; var removed = [];
  var okT = C.eligibleTactical(r).map(function(c){return c.id;});
  Object.keys(r.tactical).forEach(function(k){ if(okT.indexOf(k)===-1){ removed.push(C.cards[k].name); delete r.tactical[k]; } });
  var okC = C.eligibleCreep(r).map(function(c){return c.id;});
  if(r.creepId && okC.indexOf(r.creepId)===-1){ removed.push(C.cards[r.creepId].name); r.creepId=null; }
  if(!C.requiresCreep(r)) r.creepId = null;
  var okU = C.eligibleUnits(r).map(function(u){return u.id;});
  r.units = r.units.filter(function(e){ if(okU.indexOf(e.unitId)===-1){ removed.push(C.units[e.unitId].name); return false; } return true; });
  S.notice = removed.length ? {kind:"info", text:"Removed because "+C.cards[id].name+" cannot field them: "+removed.join(", ")+"."} : null;
  commit();
}

function placeEditor(){
  var grid = $("utiles"), ed = $("ut-editor"); if(!grid || !ed || !S.tileOpen) return;
  var open = $(S.tileOpen); if(!open) return;
  var top = open.offsetTop, tiles = Array.prototype.filter.call(grid.children, function(n){ return n.classList.contains("utile"); });
  var last = open;
  tiles.forEach(function(t){ if(t.offsetTop===top) last = t; });
  if(last.nextSibling !== ed) grid.insertBefore(ed, last.nextSibling);
}

  {id:"json", ext:"json", name:"Roster file", desc:"Brings this roster back into SurgeCraft later through Import, on any device."},
  {id:"zip", ext:"zip", name:"Everything", desc:"All seven formats above in one .zip file."}
];
function fmtById(id){ return FORMATS.filter(function(f){return f.id===id;})[0]; }
var imgCache = {};
function dataURL(path){
  if(imgCache[path]) return Promise.resolve(imgCache[path]);
  return fetch(path).then(function(r){ if(!r.ok) throw new Error("missing "+path); return r.blob(); }).then(function(b){
    return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ imgCache[path] = fr.result; res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); });
  });
}
function embedResolver(r, kind){
  var paths = Render.imagesFor(C, r, kind);
  return Promise.all(paths.map(function(p){ return dataURL(p).catch(function(){ return null; }); })).then(function(){
    return function(p){ return imgCache[p] || ""; };
  });
}

    case "csv": return Promise.resolve(X.csv(C, r));
    case "json": return Promise.resolve(X.json(C, r));
    case "sheet": return (forPreview ? Promise.resolve(null) : art ? embedResolver(r, "sheet") : Promise.resolve(BLANK)).then(function(res){ return X.rosterSheetDoc(C, r, res, {art: art}); });
    case "manual": return (forPreview ? Promise.resolve(art ? null : BLANK) : art ? embedResolver(r, "manual") : Promise.resolve(BLANK)).then(function(res){ return X.fieldManualDoc(C, r, res); });
    case "zip": return buildZip();
  }
  return Promise.reject({code:"unknown"});
}
function buildZip(){
  if(!window.JSZip) return Promise.reject({code:"nozip"});
  var z = new JSZip(), list = FORMATS.filter(function(f){ return f.id!=="zip"; });
  return list.reduce(function(p, f){ return p.then(function(){ return build(f).then(function(c){ z.file(fileName(f), c); }); }); }, Promise.resolve())
    .then(function(){ return z.generateAsync({type:"blob", compression:"DEFLATE"}); });
}
function renderExport(){
  var el = $("export"); if(!el) return;
  var r = S.cur, errs = C.validate(r).filter(function(x){return x.level==="error";});
  var h = '<div class="exhead"><div class="field"><label for="exp-base">File name</label><input class="input" id="exp-base" value="'+esc(S.exp.base || baseName())+'" maxlength="60"></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="copy-code">Copy share code</button></div></div>';
  if(errs.length) h += '<div class="notice err"><div class="grow">This roster has '+errs.length+' rules issue'+(errs.length>1?'s':'')+'. Exports still work, and the HTML versions list the issues.</div><button class="btn sm" data-a="tab" data-v="build">Fix in Build</button></div>';
  if(!S.downloads) h += '<div class="notice"><div class="grow">Saving files isn\'t available in this view. Use Copy and paste into a file, or open the preview.</div></div>';
  h += '<div class="formats">';
  FORMATS.forEach(function(f){
    var busy = S.exp.busy===f.id;
    h += '<div class="fmt'+(f.hero?' hero':'')+'"><div class="fh"><span class="ext">.'+f.ext.toUpperCase()+'</span><span class="fn">'+esc(f.name)+'</span></div><div class="fd">'+esc(f.desc)+'<div class="faint fname" style="margin-top:4px;font-size:12px">'+esc(fileName(f))+'</div></div>';
    if(f.art) h += '<label class="fo"><input type="checkbox" data-a="exp-art"'+(S.exp.art?' checked':'')+'> Include card art and miniatures</label>';
    h += '<div class="fa"><button class="btn primary sm" data-a="exp-save" data-v="'+f.id+'"'+(!S.downloads||busy?' disabled':'')+'>'+(busy?'Preparing…':'Save to disk')+'</button>'+
      (f.id!=="zip"?'<button class="btn sm" data-a="exp-copy" data-v="'+f.id+'">Copy'+(f.ext==="html"?' HTML':'')+'</button><button class="btn ghost sm" data-a="exp-prev" data-v="'+f.id+'">'+(S.exp.preview&&S.exp.preview.id===f.id?'Hide preview':'Preview')+'</button>':'')+'</div></div>';
  });
  h += '</div><p class="faint" style="font-size:12px;margin-top:10px">HTML files open in any browser. To get a PDF or paper copy, open the saved file and use your browser\'s Print command.</p>';
  if(S.exp.copyText!=null) h += '<div class="preview" id="copy-box"><div class="ph"><b>Select and copy</b><span style="color:#B9C6D2">Copying isn\'t allowed here, so the text is selected below.</span></div><textarea class="input" id="copy-fallback" readonly style="min-height:220px;border:0;border-radius:0">'+esc(S.exp.copyText)+'</textarea></div>';
  if(S.exp.preview){
    var p = S.exp.preview, f = fmtById(p.id);
    h += '<div class="preview" id="exp-preview"><div class="ph"><b>Preview · '+esc(f.name)+'</b><span style="margin-left:auto"></span><button class="btn sm" data-a="exp-prev" data-v="'+f.id+'">Close</button></div>'+
      (f.ext==="html" ? '<div class="htmlbox" id="exp-shadow"></div>' : '<pre>'+esc(p.content)+'</pre>')+'</div>';
  }
  el.innerHTML = h;
  var host = $("exp-shadow");
  if(S.exp.preview && host){
    var root = host.attachShadow ? host.attachShadow({mode:"open"}) : host;
    var doc = S.exp.preview.content, css = (doc.match(/<style>([\s\S]*?)<\/style>/)||[])[1]||"", body = (doc.match(/<body>([\s\S]*?)<\/body>/)||[])[1]||"";
    root.innerHTML = '<style>:host{display:block}'+css.replace(/(^|\})body\{/g,"$1.docbody{")+'</style><div class="docbody">'+body+'</div>';
  }
}
function flash(text, kind){ S.notice = {kind:kind||"info", text:text}; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function saveFile(f){
  if(!S.downloads || S.exp.busy) return;
  S.exp.busy = f.id; renderExport();
  build(f).then(function(content){
    S.exp.busy = null; renderExport();
    return S.downloads.save({filename:fileName(f), data:content}).then(function(res){
      flash(res && res.status==="delivered" ? fileName(f)+" sent." : "Saved "+fileName(f)+".");
    }, function(e){
      if(e && e.code==="declined") return;
      flash(e && e.code==="rate_limited" ? "A save prompt is already open. Finish it, then try again." : "The file could not be saved here. Use Copy instead.", "err");
    });
  }, function(e){ S.exp.busy = null; renderExport(); flash(e && e.code==="nozip" ? "The zip tool didn't load. Save the formats one at a time instead." : "That export could not be built. Try again, or use another format.", "err"); });
}
function copyText(text, label){
  function fallback(){ S.exp.copyText = text; if(S.tab!=="export"){ S.tab="export"; render(); } else renderExport(); var ta=$("copy-fallback"); if(ta){ ta.focus(); ta.select(); ta.scrollIntoView({block:"nearest"}); } }
  try{ navigator.clipboard.writeText(text).then(function(){ S.exp.copyText=null; flash(label+" copied."); }, fallback); }catch(e){ fallback(); }
}

/* ------------ card modal ------------ */
function openModal(html){
  $("modal-root").innerHTML = '<div class="scrim" data-a="close-modal"><div class="modal" role="dialog" aria-modal="true"><button class="mclose" data-a="close-modal" aria-label="Close">×</button>'+html+'</div></div>';
  var b = document.querySelector(".mclose"); if(b) b.focus();
}
function openDeployModal(id){
  var d = C.deployments[id]; if(!d) return;
  var side = S.cur ? C.limits(S.cur).scale.side : "standard", other = side==="standard"?"skirmish":"standard";
  var chosen = S.cur && S.cur.deployments.indexOf(id)!==-1;
  openModal('<div class="dmodal"><div class="dm-head"><h2>'+esc(d[side])+'</h2><span class="faint">'+(chosen?'On this roster · ':'')+'Deployment Card, '+(side==="standard"?"Standard Engagement side":"Skirmish Level side")+'</span></div>'+
    Render.deploymentCardHTML(d, side)+
    '<details class="dm-other"><summary>Other side of this card: '+esc(d[other])+'</summary>'+Render.deploymentCardHTML(d, other)+'</details></div>');
}
function closeModal(){ $("modal-root").innerHTML = ""; }

/* ------------ share code / import ------------ */
function b64u(str){ var b = btoa(unescape(encodeURIComponent(str))); return b.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return decodeURIComponent(escape(atob(s))); }
function shareCode(r){ return "SCM1."+b64u(JSON.stringify(C.exportable(r))); }
function importText(txt){
  txt = (txt||"").trim(); if(!txt) return;
  var obj = null;
  try{ obj = txt.indexOf("SCM1.")===0 ? JSON.parse(unb64u(txt.slice(5))) : JSON.parse(txt); }catch(e){ obj = null; }
  if(!obj){ flash("That isn't a roster share code or roster file. Share codes start with SCM1.", "err"); return; }
  var res = C.normalize(obj);
  if(!res.roster){ flash("That file doesn't contain a roster.", "err"); return; }
  var r = res.roster; r.name = r.name || "Imported roster";
  S.importOpen=false; S.cur = r; resetView(); S.notice = {kind:"info", text:"Imported "+r.name+".", dropped: res.dropped};
  Store.queue(r); render();
}

/* ------------ events ------------ */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-a]"); if(!t) return;
  var a = t.getAttribute("data-a"), v = t.getAttribute("data-v"), eu = t.getAttribute("data-e"), r = S.cur;
  if(a==="close-modal"){ if(ev.target===t || t.classList.contains("mclose")) closeModal(); return; }
  if(t.hasAttribute("disabled") || t.getAttribute("aria-disabled")==="true") return;
  switch(a){
    case "home": S.view="list"; S.cur=null; S.notice=null; S.confirmDel=null; render(); window.scrollTo(0,0); break;
    case "new": newRoster(); break;
    case "example": openExample(false, v); break;
    case "mode": P.mode = v; savePrefs(); applyMode(); break;
    case "layout": P.layout = v; savePrefs(); render(); break;
    case "tile-open": S.tileOpen = (S.tileOpen===v ? null : v); renderUnits(); var ed=$("ut-editor"); if(ed) ed.scrollIntoView({behavior:"smooth", block:"nearest"}); break;
    case "open": openRoster(t.getAttribute("data-id")); break;
    case "open-export": openRoster(t.getAttribute("data-id")); S.tab="export"; render(); break;
    case "dup": var src = S.rosters.filter(function(x){return x.id===t.getAttribute("data-id");})[0]; if(src){ var d = clone(src); d.id="r_"+RosterCore.uid(); d.name=(src.name||"Roster")+" (copy)"; d.createdAt=Date.now(); Store.queue(d); render(); } break;
    case "del": S.confirmDel = t.getAttribute("data-id"); render(); break;
    case "del-no": S.confirmDel = null; render(); break;
    case "del-yes": Store.remove(t.getAttribute("data-id")); S.confirmDel=null; render(); break;
    case "toggle-import": S.importOpen=!S.importOpen; render(); break;
    case "import-code": importText($("imp-code").value); break;
    case "dismiss": S.notice=null; render(); break;
    case "reload": location.reload(); break;
    case "install": if(APP.prompt){ var ev = APP.prompt; APP.prompt = null; ev.prompt(); (ev.userChoice||Promise.resolve()).then(function(){ render(); }); } break;
    case "tab": S.tab=v; S.exp.preview=null; S.exp.copyText=null; render(); window.scrollTo(0,0); break;
    case "scale": r.scale=v; commit(); break;
    case "race": setRace(v); break;
    case "race-yes": var rc=S.confirmRace; r.race=null; setRace(rc); break;
    case "race-no": S.confirmRace=null; render(); break;
    case "faction": setFaction(v); break;
    case "toggle": S.open[v]=!S.open[v]; render(); break;
    case "creep": r.creepId = (r.creepId===v? null : v); commit(); break;
    case "tac-toggle": if(r.tactical[v]) delete r.tactical[v]; else r.tactical[v]=1; commit(); break;
    case "tac-inc": r.tactical[v]=(r.tactical[v]||0)+1; commit(); break;
    case "tac-dec": if(r.tactical[v]>1) r.tactical[v]--; else delete r.tactical[v]; commit(); break;
    case "picker": S.picker=!S.picker; render(); break;
    case "add-unit": var e = C.newEntry(v); r.units.push(e); if(P.layout==="tiles") S.tileOpen = e.uid; commit(); var node=$(e.uid); if(node) node.scrollIntoView({block:"nearest"}); break;
    case "rm-unit": r.units = r.units.filter(function(x){return x.uid!==eu;}); if(S.tileOpen===eu) S.tileOpen=null; commit(); break;
    case "dup-unit": var e0 = entryById(eu); if(e0){ var e1 = clone(e0); e1.uid="u_"+RosterCore.uid(); r.units.splice(r.units.indexOf(e0)+1,0,e1); commit(); } break;
    case "collapse": S.open["c:"+v]=!S.open["c:"+v]; render(); break;
    case "models": var e2 = entryById(eu); if(e2){ e2.models = Number(v); commit(); } break;
    case "card": openModal(Render.unitCardHTML(C, C.units[v], eu ? entryById(eu) : null)); break;
    case "dmap": openDeployModal(v); break;
    case "tcard": openModal(Render.tacCardHTML(C, C.cards[v], null, r && r.tactical[v])); break;
    case "mission": case "deploy":
      var arr = a==="mission" ? r.missions : r.deployments, i = arr.indexOf(v);
      if(i!==-1) arr.splice(i,1); else if(arr.length<2) arr.push(v);
      commit(); break;
    case "goto-checks": var ch=$("rail-checks"); if(ch) ch.scrollIntoView({behavior:"smooth", block:"start"}); else { S.tab="build"; render(); var c2=$("rail-checks"); if(c2) c2.scrollIntoView({block:"start"}); } break;
    case "goto": var map = {setup:"sec-setup", cards:"sec-cards", units:"sec-units", scenario:"sec-scenario", slots:"rail-slots"}; var tg = $(map[v] || v); if(tg) tg.scrollIntoView({behavior:"smooth", block:"start"}); break;
    case "copy-code": copyText(shareCode(r), "Share code"); break;
    case "exp-save": saveFile(fmtById(v)); break;
    case "exp-copy": var fc = fmtById(v); build(fc).then(function(c){ copyText(c, fc.name); }); break;
    case "exp-prev":
      if(S.exp.preview && S.exp.preview.id===v){ S.exp.preview=null; renderExport(); break; }
      build(fmtById(v), true).then(function(c){ S.exp.preview = {id:v, content:c}; S.exp.copyText=null; renderExport(); var pv=$("exp-preview"); if(pv) pv.scrollIntoView({behavior:"smooth", block:"start"}); });
      break;
  }
});
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape" && $("modal-root").innerHTML){ closeModal(); return; }
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches && ev.target.matches('[role="radio"][data-a],[role="checkbox"][data-a]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener("change", function(ev){
  var t = ev.target, a = t.getAttribute && t.getAttribute("data-a"), r = S.cur;
  if(t.id==="imp-file" && t.files && t.files[0]){ var fr = new FileReader(); fr.onload = function(){ importText(String(fr.result)); }; fr.readAsText(t.files[0]); return; }
  if(a==="exp-art"){ S.exp.art = t.checked; S.exp.preview=null; renderExport(); return; }
  if(!a || !r) return;
  var e = entryById(t.getAttribute("data-e")), name = t.getAttribute("data-v");
  if(a==="upg" && e){
    var i = e.upgrades.indexOf(name);
    if(t.checked && i===-1) e.upgrades.push(name);
    if(!t.checked && i!==-1){ e.upgrades.splice(i,1); delete e.specialists[name]; }
    commit();
  } else if(a==="spec" && e){ if(t.value) e.specialists[name] = Number(t.value); else delete e.specialists[name]; commit(); }
});
var inputTimer = null, baseTimer = null;
document.addEventListener("input", function(ev){
  var t = ev.target, r = S.cur; if(!r) return;
  if(t.id==="f-name"){ r.name = t.value; commit({quiet:true}); }
  else if(t.id==="f-player"){ r.player = t.value; commit({quiet:true}); }
  else if(t.id==="f-go"){ var n = Number(t.value); if(n>2000){ r.grandMinerals = Math.floor(n); clearTimeout(inputTimer); inputTimer=setTimeout(function(){ commit({quiet:true}); renderSetup(); renderCards(); renderUnits(); },300); } }
  else if(t.id==="exp-base"){ S.exp.base = t.value; clearTimeout(baseTimer); baseTimer = setTimeout(function(){
    document.querySelectorAll(".fmt .fname").forEach(function(n, i){ n.textContent = fileName(FORMATS[i]); }); }, 150); }
});

/* ------------ boot ------------ */
applyMode();
render();
Store.init();
if(STANDALONE){
  // Outside claude.ai: save with the browser's own download.
  S.downloads = { save: function(req){
    return new Promise(function(res, rej){
      try{
        var blob = req.data instanceof Blob ? req.data : new Blob([req.data], {type: MIME[(req.filename.split(".").pop()||"").toLowerCase()] || "application/octet-stream"});
        var url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = req.filename; a.rel = "noopener"; document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
        res({status:"saved"});
      }catch(e){ rej({code:"unavailable"}); }
    });
  } };
} else if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("downloads").then(function(d){ S.downloads = d || null; if(S.view==="build" && S.tab==="export") renderExport(); }).catch(function(){});
}
})();

</script>
