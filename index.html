<style id="card-css">.sc-card{--race:#005BA4;--race-2:#00548F;--race-3:#0A3F6B;--ink:#09202E;--paper:#EDEDED;--line:#C9CDD2;--gray:#6F6F6E;--active:#36A9E0;--passive:#CD1619;--reaction:#CD9600;--min:#1685C2;--gas:#2B8F48;
display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;font-family:'Noto Sans',Arial,sans-serif;font-stretch:75%;font-size:13.5px;line-height:1.38;box-shadow:0 1px 3px rgba(0,0,0,.18);break-inside:avoid;page-break-inside:avoid;text-align:left}
.sc-card[data-race=Protoss]{--race:#BD8A00;--race-2:#E0AE0A;--race-3:#6E5200}
.sc-card[data-race=Zerg]{--race:#823287;--race-2:#722F79;--race-3:#441C49}
.sc-card *{box-sizing:border-box}
.sc-card.sc-noart{grid-template-columns:minmax(0,1fr)}
.sc-art{background:#1a1a1a;position:relative;min-height:100%}
.sc-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;max-width:100%}
.sc-tacart{background:radial-gradient(circle at 50% 40%,var(--race-2),var(--race-3));display:flex;align-items:center;justify-content:center;padding:14px}
.sc-tacart img{height:auto;max-height:260px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.sc-body{display:flex;flex-direction:column;gap:9px;padding:0 0 12px;min-width:0}
.sc-title{display:flex;align-items:center;gap:10px;background:linear-gradient(100deg,var(--race-3),var(--race) 55%,var(--race-2));color:#fff;padding:10px 14px;clip-path:polygon(0 0,100% 0,100% 100%,18px 100%,0 calc(100% - 18px))}
.sc-tl{flex:1;min-width:0}
.sc-title h3{margin:0;font-family:'Saira','Noto Sans',Arial,sans-serif;font-stretch:87.5%;font-weight:600;font-size:25px;line-height:1.05;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.sc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.sc-meta em{font-style:normal;opacity:.78;font-weight:600}
.sc-uq{background:#fff;color:var(--ink);padding:0 6px;border-radius:2px}
.sc-gas{background:var(--gas);color:#fff;padding:0 6px;border-radius:2px}
.sc-emb{width:46px;height:46px;object-fit:contain;flex:none;background:rgba(255,255,255,.92);border-radius:50%;padding:5px}
.sc-res{background:#fff;color:var(--race-3);font-weight:800;font-size:14px;padding:3px 9px;border-radius:3px;flex:none}
.sc-statrow,.sc-sec,.sc-fielded,.sc-upband,.sc-upw,.sc-foot,.sc-fine{margin-inline:12px}
.sc-statrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.sc-stats{display:flex;gap:4px;flex-wrap:wrap}
.sc-st{display:flex;flex-direction:column;align-items:center;min-width:52px}
.sc-st span{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--gray)}
.sc-st b{background:var(--race);color:#fff;font-family:'Saira','Noto Sans',sans-serif;font-weight:700;font-size:21px;min-width:52px;text-align:center;padding:1px 6px;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.sc-st.sc-sh b{background:#2A8FD0}
.sc-sup{border-collapse:collapse;font-size:12px;margin-left:auto;background:#fff}
.sc-sup th{background:var(--gray);color:#fff;font-size:10px;letter-spacing:.06em;padding:2px 8px;font-weight:700}
.sc-sup td{border:1px solid var(--line);text-align:center;padding:1px 8px;font-variant-numeric:tabular-nums}
.sc-fielded{background:#fff;border:1px solid var(--line);padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em}

/* ================= BASE ================= */
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--bg-img);background-attachment:fixed;color:var(--ink);font:14px/1.45 var(--body);font-stretch:87.5%;padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased;min-height:100%}

button,input,select,textarea{font:inherit;color:inherit;font-stretch:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.wrap{max-width:1240px;margin:0 auto}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);margin-inline:-16px;padding:8px 16px 10px;position:sticky}

.appbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.brand img{width:30px;height:30px;object-fit:contain}
.brand span b{color:var(--accent);font-weight:700}

.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:var(--hdr-sub)}
.crumb .title{font-weight:700;color:var(--hdr-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .btn.ghost{color:var(--hdr-sub)}
.crumb .btn.ghost:hover{background:rgba(255,255,255,.08);color:var(--hdr-ink)}

.modes{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;overflow:hidden}

.modes button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--hdr-ink)}

.btn.danger{color:var(--err)}

.meter.over .bar i{background:var(--err)} .meter.over .val{color:var(--err)}
.gem{width:10px;height:10px;display:inline-block;transform:rotate(45deg);border-radius:2px;margin-right:4px}
.gem.min{background:var(--min)} .gem.gas{background:var(--gas);border-radius:50%;transform:none}
.status{cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:min(var(--r),6px);border:1px solid var(--line);color:var(--ink-2);background:var(--panel-2);white-space:nowrap}
.chip.slot{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.chip.uniq{border-color:var(--ink-2);color:var(--ink);background:transparent}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;margin-top:16px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 144px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 160px);overflow:auto;padding-bottom:4px}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.section,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sec);box-shadow:var(--glow);scroll-margin-top:160px;overflow:hidden}
.section>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--deco) right center/max(var(--deco-w),110px) 100% no-repeat,linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:9px calc(14px + var(--deco-w)) 9px 14px;clip-path:var(--cut);border-bottom:2px solid var(--accent)}
.section>header .step{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:min(var(--r),10px)}
.section>header h2{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.section>header .aside{margin-left:auto;font-size:12px;color:var(--hdr-sub)}
.section>header .aside b{color:var(--hdr-ink)}
.sbody{padding:14px 16px 16px}
.panel>h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:7px 12px;border-bottom:2px solid var(--accent)}
.panel>.pb{padding:12px}

.tabbar{display:flex;align-items:flex-end;gap:10px;margin-top:14px;border-bottom:3px solid var(--accent);flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{background:var(--panel-2);border:1px solid var(--line);border-bottom:0;padding:7px 22px 7px 16px;font-family:var(--display);font-stretch:87.5%;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);clip-path:var(--tabcut);border-radius:var(--r) var(--r) 0 0}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.viewsw{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:5px;font-size:12px;color:var(--ink-2);font-weight:600}
.viewsw .seg button{padding:3px 10px;font-size:12px;display:flex;gap:5px;align-items:center}
.viewsw svg{width:14px;height:14px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl-s{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.input,select.input{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.race button{display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:87.5%;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px 6px 8px;font-size:15px}
.race button img{width:30px;height:30px;object-fit:contain}
.race button[data-v="Terran"][aria-pressed="true"]{border-color:var(--terran);color:var(--terran)}
.race button[data-v="Protoss"][aria-pressed="true"]{border-color:var(--protoss);color:var(--protoss)}
.race button[data-v="Zerg"][aria-pressed="true"]{border-color:var(--zerg);color:var(--zerg)}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.subhead .aside{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}

/* tiles (faction, creep, missions) */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;background:var(--panel);text-align:left;display:flex;gap:10px;align-items:flex-start}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"],.tile[aria-checked="true"]{border-color:var(--accent);box-shadow:var(--sel-glow);background:var(--accent-soft)}
.tile .tcol{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.tile .t-name{font-weight:800;font-size:15px}
.tile .t-meta{display:flex;flex-wrap:wrap;gap:4px}
.tile .t-sub{font-size:12px;color:var(--ink-2)}
.art-bg{background:radial-gradient(circle at 50% 45%,#2d4f6b,#0B1C29)}
[data-skin="Protoss"] .art-bg{background:radial-gradient(circle at 50% 45%,#3a7fa8,#1c2a3a)}
[data-skin="Zerg"] .art-bg{background:radial-gradient(circle at 50% 45%,#5b2862,#1d0b20)}
.dtile{flex-direction:column;gap:8px}
.dtile .d-map{display:block;width:100%;border-radius:min(var(--r),8px);overflow:hidden;background:#EDEDED;aspect-ratio:1.39;border:1px solid var(--line-2)}
.dtile .d-map img{display:block;width:100%;height:100%;object-fit:cover}
.dmodal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--ink)}
.dm-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:30px}
.dm-head h2{font-size:24px;text-transform:uppercase}
.dm-other summary{cursor:pointer;font-weight:700;color:var(--ink-2);padding:4px 0}
.dm-other[open] summary{margin-bottom:8px}
/* keyword reference */
.kwbtn{display:inline-flex;align-items:center;gap:5px;background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:var(--hdr-sub);padding:4px 10px;font-size:12px;font-weight:600}
.kwbtn:hover{color:var(--hdr-ink);background:rgba(255,255,255,.08)}
.kwbtn svg{width:15px;height:15px}
button.kw{font:inherit;font-stretch:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:2px;border-radius:2px;display:inline;line-height:inherit;text-align:inherit;vertical-align:baseline}
button.kw:hover{text-decoration-style:solid}
button.kw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.kwpop{position:fixed;z-index:60;width:min(380px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r-lg);box-shadow:0 10px 30px rgba(0,0,0,.28);padding:12px 14px 12px;font-size:13.5px;line-height:1.45}
.kwpop .kp-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.kwpop h3{font-size:17px;text-transform:uppercase;flex:1;line-height:1.2}
.kwpop .kp-x{background:none;border:0;font-size:20px;line-height:1;color:var(--ink-2);padding:0 2px}
.kwpop .kp-f{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3)}
.kw-body p{margin:0 0 6px}
.kw-body ul{margin:0 0 6px;padding-left:18px}
.kw-body li{margin:2px 0}
.kw-body p:last-child,.kw-body ul:last-child{margin-bottom:0}
@media (max-width:680px){
  .kwpop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:72vh;border-radius:var(--r-lg) var(--r-lg) 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}
.kwref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:12px}
.kwref .kr-head{padding-right:30px}
.kwref .kr-head h2{font-size:24px;text-transform:uppercase}
.kwref .kr-head p{margin:4px 0 0;color:var(--ink-2);font-size:13px}
.kwref .kr-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kwref .kr-tools .input{flex:1 1 220px}
.kr-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kr-item{border-top:1px solid var(--line-2);background:var(--panel);scroll-margin-top:12px}
.kr-item:first-child{border-top:0}
.kr-item summary{cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-family:var(--display);font-stretch:87.5%;font-weight:600;font-size:15px;letter-spacing:.03em;list-style:none}
.kr-item summary::-webkit-details-marker{display:none}
.kr-item summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .15s}
.kr-item[open] summary::after{transform:rotate(-135deg)}
.kr-item[open] summary{background:var(--accent-soft);color:var(--ink)}
.kr-item.flash summary{box-shadow:inset 4px 0 0 var(--accent)}
.kr-item .kw-body{padding:8px 12px 12px;font-size:13.5px}
.kr-empty{padding:14px;color:var(--ink-2)}
/* battle tracker */
.grow{flex:1}
.bphases{display:flex;gap:4px;flex-wrap:wrap}
.bph{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-3);background:var(--panel-2);text-transform:uppercase;letter-spacing:.05em}
.bph b{font-family:var(--display)}
.bph.done{color:var(--ink-2)}
.bph.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bsteps{margin:0;padding-left:20px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:3px}
.bunits{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.bunit{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r-lg);background:var(--panel);padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-margin-top:160px}
.bunit.acted{border-left-color:var(--ink-3);background:var(--panel-2)}
.bunit.res{border-left-color:var(--line)}
.bunit.dead{border-left-color:var(--err);opacity:.75}
.bunit.has-err{border-color:var(--err)}
.bu-h{display:flex;align-items:center;gap:10px}
.bu-h .thumb{width:44px;height:44px}
.bu-t{flex:1;min-width:0}
.bu-t .e-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.bu-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bu-row{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:13px}
.bu-row.chips,.bu-row.acts{gap:6px}
.bu-row.foot{border-top:1px solid var(--line-2);padding-top:6px;gap:4px}
.bstep{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.bs-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.bstep .stepper span{min-width:58px;padding:0 4px;white-space:nowrap}
.bstep .stepper span small{color:var(--ink-3);font-weight:500}
.bstep .stepper button{width:36px;height:34px;font-size:18px}
.bchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--ink-2)}
.bchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bchip[aria-pressed="true"]::before{content:"✓ "}
.bu-ab{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bu-ab .ab{align-self:stretch;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 8px;background:var(--panel-2)}
.bu-ab .ab.used{opacity:.7}
.ab-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.binputs{display:flex;flex-direction:column;gap:8px}
.bscore{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bs-col{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel-2)}
.bs-line{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bs-line.note{color:var(--ink-3)}
.bs-tot{border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.mks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.mmk{--ring:#3E9B4F;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:66px;padding:6px 6px 5px;border:3px solid var(--ring);border-radius:var(--r-lg);background:var(--panel);color:var(--ink)}
.mmk.red{--ring:#C8372D}.mmk.blue{--ring:#2F7BD6}
.mk-n{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.mk-o{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mk-s{font-size:10px;color:var(--ink-3)}
.mmk.me{background:var(--accent);color:var(--accent-ink)}
.mmk.opp{background:var(--hdr);color:var(--hdr-ink)}
.mmk.me .mk-s,.mmk.opp .mk-s{color:inherit;opacity:.8}
.mmk.gone{opacity:.45}
.bvp{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.bvp th,.bvp td{border-bottom:1px solid var(--line-2);padding:4px 5px;text-align:center}
.bvp th:first-child{text-align:left}
.bvp thead th{font-size:11px;color:var(--ink-2);letter-spacing:.05em}
.bvp .cur{background:var(--accent-soft)}
.bcards{display:flex;flex-direction:column;gap:6px}
.bcard{display:flex;align-items:center;gap:8px}
.bcard .thumb{width:38px;height:34px}
.bcard .bc-t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;line-height:1.25}
.bcard.ex .bc-t,.bcard.ex .thumb{opacity:.5}
.blog summary{cursor:pointer;list-style:none}
.blog summary::-webkit-details-marker{display:none}
.blog summary h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:7px 12px;border-bottom:2px solid var(--accent)}
.blog .pb{max-height:260px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.bresult{text-align:center;padding:14px 8px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel-2);margin-top:10px}
.br-w{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.br-s{font-family:var(--display);font-size:22px;font-weight:700}
.br-s small{font-size:13px;color:var(--ink-2);font-weight:500}
#b-rail>*{flex:none}
#b-rail .panel{scroll-margin-top:12px}
.bjump{display:none;gap:6px;flex-wrap:wrap;align-items:center}
@media (max-width:1020px){.bjump{display:flex}}
@media (max-width:680px){
  .bunits{grid-template-columns:minmax(0,1fr)}
  .bscore{grid-template-columns:minmax(0,1fr)}
  .bstep .stepper button{width:40px;height:38px}
}
.tile .t-art{width:58px;height:58px;flex:none;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile .t-art img{width:52px;height:52px;object-fit:contain}

/* rows */
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2);background:var(--panel)}
.row:first-child{border-top:0}
.row.on{background:var(--accent-soft)}
.thumb{width:54px;height:46px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.mini{background:var(--tile-bg);border:1px solid var(--line-2)}
.row .r-name{font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .r-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;font-size:12px;color:var(--ink-2);align-items:center}
.row .r-ctl{display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:none;width:28px;height:28px;font-size:16px;line-height:1}
.stepper button:hover{background:var(--panel-2)}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.gascost{font-weight:800;color:var(--gas);white-space:nowrap;font-variant-numeric:tabular-nums}
.mincost{font-weight:800;color:var(--min);white-space:nowrap;font-variant-numeric:tabular-nums}
.expand{grid-column:1/-1;padding-top:6px}

/* unit entries (list layout) */
.entries{display:flex;flex-direction:column;gap:10px}
.entry{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);scroll-margin-top:160px;overflow:hidden}
.entry.has-err{border-color:var(--err)}
.entry-h{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;flex-wrap:wrap;border-left:5px solid var(--accent)}
.entry-h .thumb{width:48px;height:48px}
.entry-h .e-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.entry-h .e-cost{margin-left:auto;display:flex;align-items:center;gap:8px}
.entry-b{border-top:1px solid var(--line-2);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.comps{display:flex;flex-wrap:wrap;gap:6px}
.comps button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 10px;font-size:12px;text-align:left;display:flex;gap:8px;align-items:baseline}
.comps button b{font-family:var(--display);font-size:16px}
.comps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.upg{display:flex;flex-direction:column;gap:2px}
.upg label.u{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 8px;border-radius:var(--r);cursor:pointer}
.upg label.u:hover{background:var(--panel-2)}
.upg label.u.on{background:var(--accent-soft)}
.upg input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.u-name{font-weight:800;display:flex;gap:6px;flex-wrap:wrap;align-items:center;text-transform:uppercase;letter-spacing:.01em}
.u-desc{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.u-desc b{color:var(--ink)}
.tp{display:inline-block;font-weight:800;font-size:10px;color:#fff;padding:0 5px;border-radius:2px;line-height:1.6;letter-spacing:.02em}
.tp.Active{background:#36A9E0}.tp.Passive{background:#CD1619}.tp.Reaction{background:#CD9600}
.spec{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.spec select{padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.loadout{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 var(--r) var(--r) 0}
.picker{border:1px dashed var(--line);border-radius:var(--r-lg);padding:10px;background:var(--panel-2)}
.pgroup+.pgroup{margin-top:10px}

/* ================= TILE LAYOUT ================= */
.utiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.utile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--glow);min-width:0;scroll-margin-top:160px}
.utile.open{border-color:var(--accent);box-shadow:var(--sel-glow)}
.utile.has-err{border-color:var(--err)}
.utile.on{border-color:var(--accent)}
.ut-img{position:relative;height:138px;background:var(--tile-bg);display:flex;align-items:flex-end;justify-content:center;border:0;padding:0;width:100%;border-bottom:3px solid var(--accent)}
.ut-img img{height:128px;width:auto;max-width:92%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ut-img.card img{height:112px;margin-bottom:12px}
.ut-img.art-bg{border-bottom-color:var(--accent)}
.ut-tl{position:absolute;top:6px;left:6px;display:flex;gap:4px;flex-wrap:wrap}
.ut-tr{position:absolute;top:6px;right:6px;background:var(--panel);border-radius:var(--r);padding:1px 7px;box-shadow:0 1px 3px rgba(0,0,0,.18);font-size:13px}
.ut-body{padding:8px 10px 6px;display:flex;flex-direction:column;gap:4px;flex:1}
.ut-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:16px;line-height:1.15;text-transform:uppercase;letter-spacing:.02em}
.ut-meta{font-size:12px;color:var(--ink-2)}
.ut-ups{display:flex;flex-wrap:wrap;gap:3px}
.ut-ups span{font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:min(var(--r),6px)}
.ut-err{font-size:11.5px;color:var(--err);font-weight:700}
.ut-act{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px 10px;align-items:center}
.ut-act .grow{flex:1}
.ut-editor{grid-column:1/-1}
.ut-editor .entry{border-color:var(--accent);box-shadow:var(--sel-glow)}
.ttile .ut-img{height:118px}

/* slots */
.slots{display:flex;flex-direction:column;gap:8px}
.slotrow{display:grid;grid-template-columns:66px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px}
.slotrow .sn{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:13px;height:13px;border:1.5px solid var(--ink-3);background:transparent;clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
[data-skin="Protoss"] .pip{clip-path:none;border-radius:50%}
[data-skin="Zerg"] .pip{clip-path:none;border-radius:50% 50% 50% 10%}
.pip.used{background:var(--accent);border-color:var(--accent)}
.pip.over{background:var(--err);border-color:var(--err)}
.slotrow .sc{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.slotrow.bad .sc,.slotrow.bad .sn{color:var(--err)}
.src{font-size:11px;color:var(--ink-3);grid-column:2/-1;margin-top:-4px}

/* checks */
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.4;padding:6px 8px;border-radius:var(--r);text-align:left;border:0;width:100%;color:inherit}
.check.error{background:var(--err-soft)} .check.warn{background:var(--warn-soft)} .check.info{background:var(--panel-2);color:var(--ink-2)}
.check .mk{width:9px;height:9px;margin-top:4px;transform:rotate(45deg)}
.check.error .mk{background:var(--err)} .check.warn .mk{background:var(--warn)} .check.info .mk{background:var(--ink-3)}
.check .ref{font-size:11px;color:var(--ink-3);white-space:nowrap}
.legal{font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

/* list view */
.listhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.listhead h1{font-size:28px;text-transform:uppercase;letter-spacing:.05em}
.listhead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.examples{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 16px;font-size:13px;color:var(--ink-2)}
.examples button{display:inline-flex;align-items:center;gap:6px}
.examples img{width:18px;height:18px;object-fit:contain}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sec);display:flex;flex-direction:column;box-shadow:var(--glow);overflow:hidden;color:var(--ink)}
.rcard .rc-top{position:relative;display:flex;align-items:center;gap:10px;background:var(--deco) right center/max(var(--deco-w-sm),90px) 100% no-repeat,linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);padding:10px calc(12px + var(--deco-w-sm)) 12px 12px;clip-path:var(--cut)}
.rcard .rc-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--stripe)}
.rcard .rc-top img{width:36px;height:36px;object-fit:contain;flex:none}
.rcard .rc-name{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:18px;line-height:1.2;word-break:break-word;text-transform:uppercase}
.rcard .rc-fac{font-size:12px;color:var(--hdr-sub)}
.rcard .rc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px;flex:1;background:var(--bg-img),var(--panel);background-blend-mode:normal}
.rcard .rc-minis{display:flex;gap:2px;min-height:44px;align-items:flex-end;flex-wrap:wrap}
.rcard .rc-minis img{width:40px;height:44px;object-fit:contain}
.rcard .rc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.rcard .rc-stats b{display:block;font-size:15px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.rcard .rc-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.notice{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.notice.err{border-left-color:var(--err)}
.notice .grow{flex:1 1 260px;min-width:0}
.empty{border:1px dashed var(--line);border-radius:var(--r-lg);padding:22px;text-align:center;color:var(--ink-2);background:var(--panel)}
.importbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
textarea.input{min-height:74px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}

.sheetwrap{background:#fff;color:#09202E;border-radius:var(--r-lg);padding:22px;margin-top:16px;box-shadow:var(--glow);max-width:960px}

/* export */
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;margin-top:16px}
.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.fmt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--glow)}
.fmt.hero{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent),var(--glow)}
.fmt .fh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.fmt .ext{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;background:var(--hdr);color:var(--hdr-ink);padding:3px 7px;min-width:52px;text-align:center;border-radius:min(var(--r),6px)}
.fmt .fn{font-weight:800;font-size:15px}
.fmt .fd{padding:8px 12px;font-size:13px;color:var(--ink-2);flex:1}
.fmt .fo{padding:0 12px 8px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.fmt .fo input{accent-color:var(--accent)}
.fmt .fa{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line-2);background:var(--panel-2)}
.preview{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;scroll-margin-top:160px}
.preview .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(100deg,var(--hdr),var(--hdr-2));color:var(--hdr-ink);flex-wrap:wrap}
.preview .ph b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase}
.preview .ph .btn{color:var(--ink)}
.preview pre{margin:0;padding:12px;max-height:520px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.preview .htmlbox{max-height:680px;overflow:auto;background:#D9DDE2}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,10,16,.62);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 24px;overflow:auto}
.modal{max-width:1000px;width:100%;position:relative}
.modal .mclose{position:absolute;top:-6px;right:-6px;z-index:2;background:var(--hdr);color:var(--hdr-ink);border:2px solid #fff;border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}

@media (max-width:1020px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
}
@media (max-width:680px){
  .strip{position:static;background:none}
  .strip>.wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.exhead{grid-template-columns:minmax(0,1fr)}
  .meter .val{font-size:18px}
  .savestate .txt,.modes .ml,.kwbtn .ml{display:none}
  .kwbtn{padding:5px 8px}
  .crumb{order:5;flex-basis:100%}
  .sbody{padding:12px}
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .r-ctl{grid-column:1/-1;justify-content:flex-end}
  .sheetwrap{padding:14px}
  .modal .mclose{top:4px;right:4px}
  .utiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ut-img{height:112px}.ut-img img{height:104px}
  .viewsw{margin-left:0;width:100%;padding-top:4px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
/* StarCraft TMG roster rules engine.
 * Pure functions over the verified card dataset; no DOM. Works in the browser (window.RosterCore)
 * and in Node (module.exports) so the rules can be tested outside the page.
 * Rule references are to the Full Rules (Part 9.1) and the Organized Play Rules (OP). */
(function (root) {
  "use strict";

  var SLOT_TYPES = ["Core", "Elite", "Support", "Air", "Hero"];
  var SCALES = {
    skirmish: { id: "skirmish", name: "Skirmish", minerals: 1000, battlefield: "36\" × 36\"", side: "skirmish" },
    standard: { id: "standard", name: "Standard", minerals: 2000, battlefield: "54\" × 36\"", side: "standard" },
    grand: { id: "grand", name: "Grand Offensive", minerals: null, battlefield: "72\" × 36\"", side: "standard" }
  };
  var RESOURCE_NAMES = { CP: "Command Points", PE: "Psionic Energy", BM: "Biomass" };

  function Core(data) {
    var self = this;
    this.data = data;
    this.units = {};
    this.cards = {};
    this.missions = {};
    this.deployments = {};
    data.units.forEach(function (u) { self.units[u.id] = u; });
    data.cards.forEach(function (c) { self.cards[c.id] = c; });
    data.missions.forEach(function (m) { self.missions[m.id] = m; });
    data.deployments.forEach(function (d) { self.deployments[d.id] = d; });
  }

  Core.SLOT_TYPES = SLOT_TYPES;
  Core.SCALES = SCALES;
  Core.RESOURCE_NAMES = RESOURCE_NAMES;

  /* ---------- helpers ---------- */
  function tagsFit(itemTags, factionTags) {
    // Part 9.1.2: every tag on the card must also appear on the Faction Card.
    return itemTags.every(function (t) { return factionTags.indexOf(t) !== -1; });
  }
  function emptySlots() { var o = {}; SLOT_TYPES.forEach(function (s) { o[s] = 0; }); return o; }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  Core.uid = uid;

  Core.prototype.newRoster = function () {
    return {
      id: "r_" + uid(), name: "New roster", player: "", scale: "standard", grandMinerals: 3000,
      race: null, factionId: null, tactical: {}, creepId: null, units: [],
      missions: [], deployments: [], notes: "", createdAt: Date.now(), updatedAt: Date.now()
    };
  };

  Core.prototype.limits = function (r) {
    var s = SCALES[r.scale] || SCALES.standard;
    var minerals = s.id === "grand" ? Math.max(2001, Math.floor(Number(r.grandMinerals) || 2001)) : s.minerals;
    // Part 9.1.1 / 9.1.4: Vespene Gas is 10% of the Mineral limit at every scale.
    return { minerals: minerals, gas: Math.floor(minerals / 10), scale: s };
  };

  Core.prototype.faction = function (r) { return r.factionId ? this.cards[r.factionId] || null : null; };

  Core.prototype.factionCards = function (race) {
    return this.data.cards.filter(function (c) { return c.kind === "Faction" && (!race || c.race === race); });
  };

  Core.prototype.eligibleTactical = function (r) {
    var f = this.faction(r); if (!f) return [];
    return this.data.cards.filter(function (c) { return c.kind === "Tactical" && tagsFit(c.faction_tags, f.faction_tags); });
  };
  Core.prototype.eligibleCreep = function (r) {
    var f = this.faction(r); if (!f) return [];
    return this.data.cards.filter(function (c) { return c.kind === "Creep" && tagsFit(c.faction_tags, f.faction_tags); });
  };
  Core.prototype.eligibleUnits = function (r) {
    var f = this.faction(r); if (!f) return [];
    return this.data.units.filter(function (u) { return !u.summoned && tagsFit(u.faction_tags, f.faction_tags); });
  };
  Core.prototype.requiresCreep = function (r) {
    var f = this.faction(r);
    return !!f && f.abilities.some(function (a) { return a.name === "Zerg Creep"; });
  };

  /* ---------- a unit entry on the roster ---------- */
  Core.prototype.newEntry = function (unitId) {
    var u = this.units[unitId];
    return { uid: "u_" + uid(), unitId: unitId, models: u.compositions[0].models, upgrades: [], specialists: {} };
  };
  Core.prototype.composition = function (entry) {
    var u = this.units[entry.unitId];
    if (!u) return null;
    for (var i = 0; i < u.compositions.length; i++) if (u.compositions[i].models === entry.models) return { index: i, comp: u.compositions[i] };
    return null;
  };
  Core.prototype.upgradeDef = function (entry, name) {
    var u = this.units[entry.unitId];
    return u ? u.upgrades.filter(function (x) { return x.name === name; })[0] || null : null;
  };
  Core.prototype.upgradeCost = function (entry, name) {
    var c = this.composition(entry), up = this.upgradeDef(entry, name);
    if (!c || !up || !up.cost_by_composition) return null;
    return up.cost_by_composition[c.index];
  };
  Core.prototype.entryCost = function (entry) {
    var self = this, c = this.composition(entry);
    if (!c) return { base: 0, upgrades: 0, total: 0, supply: 0 };
    var up = 0;
    entry.upgrades.forEach(function (n) { var v = self.upgradeCost(entry, n); if (typeof v === "number") up += v; });
    return { base: c.comp.minerals, upgrades: up, total: c.comp.minerals + up, supply: c.comp.supply };
  };

  /* ---------- roster totals ---------- */
  Core.prototype.slots = function (r) {
    var self = this, avail = emptySlots(), used = emptySlots(), sources = {};
    SLOT_TYPES.forEach(function (s) { sources[s] = []; });
    var f = this.faction(r);
    if (f) Object.keys(f.slots).forEach(function (s) { avail[s] += f.slots[s]; sources[s].push({ name: f.name, n: f.slots[s] }); });
    Object.keys(r.tactical || {}).forEach(function (id) {
      var c = self.cards[id], n = r.tactical[id] || 0;
      if (!c || !n) return;
      Object.keys(c.slots).forEach(function (s) { avail[s] += c.slots[s] * n; sources[s].push({ name: c.name + (n > 1 ? " ×" + n : ""), n: c.slots[s] * n }); });
    });
    r.units.forEach(function (e) {
      var u = self.units[e.unitId], c = self.composition(e);
      // Part 9.1.6: a Unit occupies Army Slots of its type equal to its starting Supply Value.
      if (u && c && u.army_slot) used[u.army_slot] += c.comp.supply;
    });
    return { available: avail, used: used, sources: sources };
  };

  Core.prototype.totals = function (r) {
    var self = this, minerals = 0, supply = 0, gas = 0;
    r.units.forEach(function (e) { var c = self.entryCost(e); minerals += c.total; supply += c.supply; });
    Object.keys(r.tactical || {}).forEach(function (id) { var c = self.cards[id]; if (c) gas += (c.gas_cost || 0) * (r.tactical[id] || 0); });
    if (r.creepId && this.cards[r.creepId]) gas += this.cards[r.creepId].gas_cost || 0;
    return { minerals: minerals, gas: gas, supply: supply };
  };

  /* ---------- loadout (what each model carries) ---------- */
  Core.prototype.loadout = function (entry) {
    var self = this, u = this.units[entry.unitId];
    if (!u) return null;
    var base = u.weapons.map(function (w) { return w.name; });
    var allWeapons = base.slice(), replacedAll = {}, added = [], specialistLines = [], abilitiesTaken = [];
    entry.upgrades.forEach(function (n) {
      var up = self.upgradeDef(entry, n); if (!up) return;
      if (up.specialist) {
        var m = entry.specialists && entry.specialists[n];
        specialistLines.push({ model: m || null, name: up.name, replaces: up.replaces || null });
      } else if (up.kind === "weapon") {
        if (up.replaces) replacedAll[up.replaces] = up.name; else added.push(up.name);
      } else {
        abilitiesTaken.push(up.name);
      }
    });
    allWeapons = allWeapons.map(function (w) { return replacedAll[w] || w; }).concat(added);
    return { weapons: allWeapons, replaced: replacedAll, specialists: specialistLines, abilities: abilitiesTaken };
  };

  Core.prototype.loadoutText = function (entry) {
    var l = this.loadout(entry); if (!l) return "";
    var parts = [];
    Object.keys(l.replaced).forEach(function (w) { parts.push(l.replaced[w] + " (replaces " + w + ")"); });
    l.abilities.forEach(function (a) { parts.push(a); });
    l.specialists.slice().sort(function (a, b) { return (a.model || 99) - (b.model || 99); }).forEach(function (s) {
      parts.push("Model " + (s.model || "?") + ": " + s.name + (s.replaces ? " (replaces " + s.replaces + ")" : ""));
    });
    var weapons = l.weapons.join(", ");
    return (weapons ? "Weapons: " + weapons : "") + (parts.length ? (weapons ? ". " : "") + "Upgrades: " + parts.join("; ") : "");
  };

  /* ---------- validation ---------- */
  Core.prototype.validate = function (r) {
    var self = this, out = [];
    function add(level, msg, ref, target) { out.push({ level: level, msg: msg, ref: ref || "", target: target || null }); }
    var lim = this.limits(r), t = this.totals(r), f = this.faction(r);

    if (!r.race) add("error", "Choose a race.", "9.1.2", "setup");
    if (!f) add("error", "Choose a Faction Card. Every army includes exactly one.", "9.1.2 / 5.4", "setup");
    if (f && r.race && f.race !== r.race) add("error", f.name + " is not a " + r.race + " Faction Card.", "9.1.2", "setup");

    if (t.minerals > lim.minerals) add("error", "Minerals " + t.minerals + " exceed the " + lim.minerals + " limit by " + (t.minerals - lim.minerals) + ".", "9.1.3", "units");
    if (t.gas > lim.gas) add("error", "Vespene Gas " + t.gas + " exceeds the " + lim.gas + " limit by " + (t.gas - lim.gas) + ".", "9.1.4", "cards");

    // Tactical cards: eligibility and Unique
    Object.keys(r.tactical || {}).forEach(function (id) {
      var c = self.cards[id], n = r.tactical[id] || 0; if (!n) return;
      if (!c || c.kind !== "Tactical") { add("error", "Unknown Tactical Card (" + id + ").", "9.1.5", "cards"); return; }
      if (f && !tagsFit(c.faction_tags, f.faction_tags)) add("error", c.name + " has tags (" + c.faction_tags.join(", ") + ") not on " + f.name + ".", "9.1.2", "cards");
      if (c.unique && n > 1) add("error", c.name + " is Unique: only one copy allowed (" + n + " taken).", "9.1.5", "cards");
    });

    // Creep
    if (this.requiresCreep(r)) {
      if (!r.creepId) add("error", f.name + " requires exactly one Creep Card (Zerg Creep).", f.name + " card", "cards");
      else if (!this.eligibleCreep(r).some(function (c) { return c.id === r.creepId; })) add("error", (self.cards[r.creepId] ? self.cards[r.creepId].name : r.creepId) + " is not allowed with " + f.name + ".", "9.1.2", "cards");
    } else if (r.creepId) add("error", "Creep Cards can only be taken by a Faction Card with Zerg Creep.", "9.1.2", "cards");

    // Slots
    var sl = this.slots(r);
    SLOT_TYPES.forEach(function (s) {
      if (sl.used[s] > sl.available[s]) add("error", s + " slots: " + sl.used[s] + " used, " + sl.available[s] + " available. Add a card that provides " + s + " slots or reduce Supply.", "9.1.5 / 9.1.6", "slots");
    });

    // Units
    var uniqueSeen = {};
    r.units.forEach(function (e, i) {
      var u = self.units[e.unitId], label = (u ? u.name : e.unitId) + " (#" + (i + 1) + ")";
      if (!u) { add("error", "Unknown unit " + e.unitId + ".", "9.1.6", e.uid); return; }
      if (u.summoned) add("error", u.name + " is a Summoned Unit and cannot be recruited.", "9.1.9", e.uid);
      if (f && !tagsFit(u.faction_tags, f.faction_tags)) add("error", label + " has tags (" + u.faction_tags.join(", ") + ") not on " + f.name + ".", "9.1.2", e.uid);
      if (!self.composition(e)) add("error", label + ": " + e.models + " models is not a Composition Option.", "9.1.6", e.uid);
      if (u.unique) { uniqueSeen[u.id] = (uniqueSeen[u.id] || 0) + 1; if (uniqueSeen[u.id] === 2) add("error", u.name + " is Unique: only one allowed.", "Unique", e.uid); }
      var names = {}, spModels = {};
      e.upgrades.forEach(function (n) {
        var up = self.upgradeDef(e, n);
        if (!up) { add("error", label + ": " + n + " is not an upgrade on this card.", "9.1.7", e.uid); return; }
        if (names[n]) add("error", label + ": " + n + " taken twice.", "9.1.7", e.uid);
        names[n] = true;
        if (up.specialist) {
          var m = e.specialists && e.specialists[n];
          if (!m) add("error", label + ": nominate the model that carries " + n + " (SPECIALIST).", "9.1.7", e.uid);
          else if (m < 1 || m > e.models) add("error", label + ": " + n + " is nominated to model " + m + ", but the unit has " + e.models + " models.", "9.1.7", e.uid);
          else if (spModels[m]) add("error", label + ": model " + m + " carries both " + spModels[m] + " and " + n + ". Each SPECIALIST upgrade goes on a different model.", "9.1.7", e.uid);
          else spModels[m] = n;
        }
      });
      // Two non-specialist replacements for the same weapon
      var repl = {};
      e.upgrades.forEach(function (n) {
        var up = self.upgradeDef(e, n);
        if (up && up.replaces && !up.specialist) {
          if (repl[up.replaces]) add("warn", label + ": " + repl[up.replaces] + " and " + n + " both replace " + up.replaces + ". After the first, no model carries it.", "9.1.7", e.uid);
          else repl[up.replaces] = n;
        }
      });
    });

    // Organized Play submission requirements
    var ms = r.missions || [], ds = r.deployments || [];
    if (ms.length !== 2) add("warn", "Tournament rosters list 2 Mission Cards (" + ms.length + " chosen).", "OP: Army Rosters", "scenario");
    if (ds.length !== 2) add("warn", "Tournament rosters list 2 Deployment Cards (" + ds.length + " chosen).", "OP: Army Rosters", "scenario");
    if (new Set(ms).size !== ms.length || new Set(ds).size !== ds.length) add("error", "No duplicate cards within your own Mission or Deployment set.", "9.2", "scenario");
    if (!r.player) add("warn", "Tournament rosters show the player's name.", "OP: Army Rosters", "setup");

    // Informational
    if (f && t.minerals < lim.minerals) add("info", (lim.minerals - t.minerals) + " Minerals unspent. Unspent Minerals are lost.", "9.1.3", "units");
    if (f && t.gas < lim.gas) add("info", (lim.gas - t.gas) + " Vespene Gas unspent. Unspent Gas is lost.", "9.1.4", "cards");
    if (f) SLOT_TYPES.forEach(function (s) {
      var free = sl.available[s] - sl.used[s];
      if (free > 0) add("info", free + " " + s + " slot" + (free > 1 ? "s" : "") + " unused" + (s === "Air" ? " (no current unit uses Air slots)" : "") + ". Unused slots are lost.", "9.1.6", "slots");
    });
    return out;
  };

  Core.prototype.isLegal = function (r) { return !this.validate(r).some(function (v) { return v.level === "error"; }); };

  /* ---------- import / export ---------- */
  Core.prototype.normalize = function (raw) {
    // Accept an imported roster and keep only what the dataset recognizes. Returns {roster, dropped}.
    var self = this, dropped = [], r = this.newRoster();
    if (!raw || typeof raw !== "object") return { roster: null, dropped: ["Not a roster file."] };
    ["name", "player", "notes"].forEach(function (k) { if (typeof raw[k] === "string") r[k] = raw[k].slice(0, 200); });
    if (SCALES[raw.scale]) r.scale = raw.scale;
    if (Number(raw.grandMinerals) > 2000) r.grandMinerals = Math.floor(Number(raw.grandMinerals));
    if (["Terran", "Protoss", "Zerg"].indexOf(raw.race) !== -1) r.race = raw.race;
    if (raw.factionId && this.cards[raw.factionId] && this.cards[raw.factionId].kind === "Faction") r.factionId = raw.factionId;
    else if (raw.factionId) dropped.push("Faction " + raw.factionId);
    Object.keys(raw.tactical || {}).forEach(function (id) {
      var n = Math.max(0, Math.min(9, Math.floor(Number(raw.tactical[id]) || 0)));
      if (self.cards[id] && self.cards[id].kind === "Tactical") { if (n) r.tactical[id] = n; } else dropped.push("Tactical Card " + id);
    });
    if (raw.creepId) { if (this.cards[raw.creepId] && this.cards[raw.creepId].kind === "Creep") r.creepId = raw.creepId; else dropped.push("Creep Card " + raw.creepId); }
    (Array.isArray(raw.units) ? raw.units : []).forEach(function (e) {
      var u = e && self.units[e.unitId];
      if (!u || u.summoned) { dropped.push("Unit " + (e && e.unitId)); return; }
      var ent = self.newEntry(u.id);
      if (u.compositions.some(function (c) { return c.models === e.models; })) ent.models = e.models;
      (Array.isArray(e.upgrades) ? e.upgrades : []).forEach(function (n) {
        if (u.upgrades.some(function (x) { return x.name === n; }) && ent.upgrades.indexOf(n) === -1) ent.upgrades.push(n); else dropped.push(u.name + " upgrade " + n);
      });
      Object.keys(e.specialists || {}).forEach(function (n) { if (ent.upgrades.indexOf(n) !== -1) ent.specialists[n] = Math.floor(Number(e.specialists[n])) || null; });
      r.units.push(ent);
    });
    (Array.isArray(raw.missions) ? raw.missions : []).forEach(function (id) { if (self.missions[id]) r.missions.push(id); else dropped.push("Mission " + id); });
    (Array.isArray(raw.deployments) ? raw.deployments : []).forEach(function (id) { if (self.deployments[id]) r.deployments.push(id); else dropped.push("Deployment " + id); });
    if (!r.race && r.factionId) r.race = this.cards[r.factionId].race;
    return { roster: r, dropped: dropped };
  };

  Core.prototype.exportable = function (r) {
    return {
      format: "sc-tmg-roster", version: 1,
      name: r.name, player: r.player, scale: r.scale, grandMinerals: r.grandMinerals, race: r.race,
      factionId: r.factionId, tactical: r.tactical, creepId: r.creepId,
      units: r.units.map(function (e) { return { unitId: e.unitId, models: e.models, upgrades: e.upgrades, specialists: e.specialists }; }),
      missions: r.missions, deployments: r.deployments, notes: r.notes
    };
  };

  /* ---------- plain-text roster (Organized Play fields) ---------- */
  Core.prototype.rosterText = function (r) {
    var self = this, lim = this.limits(r), t = this.totals(r), f = this.faction(r), L = [];
    L.push(r.name || "Roster");
    L.push("Player: " + (r.player || "—"));
    L.push("Faction: " + (r.race || "—") + " — " + (f ? f.name : "—"));
    L.push("Engagement: " + lim.scale.name + " (" + lim.minerals + " Minerals / " + lim.gas + " Vespene Gas)");
    L.push("");
    L.push("UNITS");
    r.units.forEach(function (e) {
      var u = self.units[e.unitId], c = self.entryCost(e);
      if (!u) return;
      L.push("- " + u.name + " ×" + e.models + " [" + u.army_slot + "] — Supply " + c.supply + " — " + c.total + " Minerals" + (c.upgrades ? " (" + c.base + " + " + c.upgrades + " upgrades)" : ""));
      var lt = self.loadoutText(e); if (lt) L.push("    " + lt);
    });
    L.push("Total Supply: " + t.supply + "   Total Minerals: " + t.minerals + " / " + lim.minerals);
    L.push("");
    L.push("TACTICAL CARDS");
    Object.keys(r.tactical || {}).forEach(function (id) {
      var c = self.cards[id], n = r.tactical[id]; if (!c || !n) return;
      L.push("- " + c.name + (n > 1 ? " ×" + n : "") + " — " + (c.gas_cost * n) + " Vespene Gas");
    });
    if (r.creepId && self.cards[r.creepId]) L.push("- " + self.cards[r.creepId].name + " (Creep Card) — " + self.cards[r.creepId].gas_cost + " Vespene Gas");
    L.push("Total Vespene Gas: " + t.gas + " / " + lim.gas);
    L.push("");
    L.push("MISSION CARDS: " + ((r.missions || []).map(function (id) { return self.missions[id] ? self.missions[id].name : id; }).join(", ") || "—"));
    L.push("DEPLOYMENT CARDS: " + ((r.deployments || []).map(function (id) { var d = self.deployments[id]; return d ? d[lim.scale.side] : id; }).join(", ") || "—"));
    return L.join("\n");
  };

  if (typeof module !== "undefined" && module.exports) module.exports = Core;
  else root.RosterCore = Core;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
/* SurgeCraft — card rendering and export builders.
 * Pure string builders over RosterCore; no DOM access. Shared by the app page and every export,
 * so a card looks the same in the builder, the Field Manual HTML and the Roster Sheet HTML. */
(function (root) {
  "use strict";

  var PHASES = ["Any", "Movement", "Assault", "Combat"];
  var PHASE_NAME = { Any: "Any Phase", Movement: "Movement Phase", Assault: "Assault Phase", Combat: "Combat Phase" };
  var ICON = {
    Movement: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.6 8h5.6M8.2 5.2 11 8l-2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    Assault: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 .8v3.4M8 11.8v3.4M.8 8h3.4M11.8 8h3.4" stroke="currentColor" stroke-width="1.5"/></svg>',
    Combat: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6C4.6 1.6 2.4 3.9 2.4 6.8c0 1.8.9 3.1 2.1 3.8v2.2c0 .6.5 1.1 1.1 1.1h4.8c.6 0 1.1-.5 1.1-1.1v-2.2c1.2-.7 2.1-2 2.1-3.8 0-2.9-2.2-5.2-5.6-5.2z" fill="currentColor"/><circle cx="5.9" cy="7" r="1.35" fill="var(--race,#09202E)"/><circle cx="10.1" cy="7" r="1.35" fill="var(--race,#09202E)"/><path d="M7 11.4v1.6M9 11.4v1.6" stroke="var(--race,#09202E)" stroke-width="1"/></svg>',
    Any: ""
  };
  var RES = { Terran: "CP", Protoss: "PE", Zerg: "BM" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }

  var ART = {
    unit: function (id) { return "img/units/" + id + ".webp"; },
    mini: function (id) { return "img/minis/" + id + ".webp"; },
    card: function (id) { return "img/cards/" + id + ".webp"; },
    race: function (r) { return "img/race/" + String(r).toLowerCase() + ".webp"; },
    deploy: function (id, side) { return "img/deploy/" + id + "-" + side + ".webp"; }
  };
  var identity = function (p) { return p; };

  /* Wrap keyword-looking UPPERCASE runs and "Friendly/Enemy" in bold, the way the printed cards emphasise terms. */
  function richText(t) {
    var s = esc(t);
    s = s.replace(/\b([A-Z][A-Z\-']{1,}\b(?:\s+(?:[A-Z][A-Z\-']*\b(?![a-z])|\([^)]*\)|\d+\+?"?))*(?:\s+[A-Z][a-z]+(?=\s*\())?(?:\s*\([^)]*\))?)/g, "<b>$1</b>");
    s = s.replace(/\b(Friendly|Enemy|Once per Game|Once per Round|Once Per Game)\b/g, "<b>$1</b>");
    return s;
  }

  function typePill(t) { return t ? '<span class="sc-pill sc-' + esc(t.toLowerCase()) + '">' + esc(t.toUpperCase()) + "</span>" : ""; }

  function abilityBox(a, opts) {
    opts = opts || {};
    var cost = a.cost ? '<span class="sc-cost">' + esc(a.cost) + "</span>" : "";
    var extra = opts.extra || "";
    return '<div class="sc-ab' + (opts.upgrade ? " sc-up" : "") + (opts.taken ? " sc-taken" : "") + '">' +
      (opts.upgrade ? '<span class="sc-uptag">UPGRADE' + (opts.costText ? ' · <span class="sc-min">' + esc(opts.costText) + "</span>" : "") + "</span>" : "") +
      '<p><span class="sc-abn">' + esc(a.name.toUpperCase()) + ":</span> " + typePill(a.type) + cost + " " + richText(a.text) + "</p>" + extra + "</div>";
  }

  function weaponTable(ws, opts) {
    opts = opts || {};
    if (!ws.length) return "";
    var h = '<div class="sc-tw"><table class="sc-wt"><thead><tr><th>Name</th><th>RNG</th><th>Target</th><th>RoA</th><th>Hit</th><th>Surge type</th><th>S Dice</th><th>Dmg</th><th>Keyword</th></tr></thead><tbody>';
    ws.forEach(function (w) {
      var cls = [];
      if (opts.replaced && opts.replaced[w.name]) cls.push("sc-struck");
      if (opts.taken && opts.taken[w.name]) cls.push("sc-taken");
      var note = "";
      if (w.replaces) note += '<span class="sc-for">&#9650; FOR ' + esc(w.replaces.toUpperCase()) + "</span>";
      if (opts.replaced && opts.replaced[w.name]) note += '<span class="sc-for">REPLACED BY ' + esc(opts.replaced[w.name].toUpperCase()) + "</span>";
      if (opts.costs && opts.costs[w.name]) note += '<span class="sc-for sc-min">' + esc(opts.costs[w.name]) + "</span>";
      if (opts.specialist && opts.specialist[w.name]) note += '<span class="sc-for">MODEL ' + esc(opts.specialist[w.name]) + "</span>";
      h += '<tr class="' + cls.join(" ") + '"><td class="sc-wn">' + esc(w.name.toUpperCase()) + note + "</td><td>" + esc(w.rng) + "</td><td>" + esc(w.target) + "</td><td>" + esc(w.roa) + "</td><td>" + esc(w.hit) +
        "</td><td>" + esc(w.surge_type) + "</td><td>" + esc(w.s_dice) + "</td><td>" + esc(w.dmg) + "</td><td>" + esc(w.keywords.join(", ") || "-") + "</td></tr>";
    });
    return h + "</tbody></table></div>";
  }

  function phaseHead(p, label) {
    return '<div class="sc-ph"><span class="sc-phtab">' + (ICON[p] ? '<i class="sc-ico">' + ICON[p] + "</i>" : "") + esc(PHASE_NAME[p].toUpperCase()) + "</span>" + (label ? '<span class="sc-phx">' + esc(label) + "</span>" : "") + "</div>";
  }

  /* ---------- UNIT CARD ---------- */
  function unitCardHTML(C, u, entry, src) {
    src = src || identity;
    var st = u.stats, lo = entry ? C.loadout(entry) : null, comp = entry ? C.composition(entry) : null;
    var takenNames = {}; if (entry) entry.upgrades.forEach(function (n) { takenNames[n] = true; });
    var artSrc = src(ART.unit(u.id)), emb = src(ART.race(u.race));
    var h = '<article class="sc-card' + (artSrc ? "" : " sc-noart") + '" data-race="' + esc(u.race) + '">';
    if (artSrc) h += '<div class="sc-art"><img src="' + esc(artSrc) + '" alt="' + esc(u.name) + ' miniatures" loading="lazy"></div>';
    h += '<div class="sc-body">';
    // title bar
    h += '<header class="sc-title"><div class="sc-tl"><h3>' + esc(u.name.toUpperCase()) + "</h3>" +
      '<div class="sc-meta">' + (u.army_slot ? '<span><em>ARMY SLOT:</em> ' + esc(u.army_slot.toUpperCase()) + "</span>" : '<span><em>SUMMONED UNIT</em></span>') +
      '<span><em>COMBAT ROLE:</em> ' + esc(String(u.combat_role).toUpperCase()) + "</span>" + (u.unique ? '<span class="sc-uq">UNIQUE</span>' : "") + "</div></div>" +
      (emb ? '<img class="sc-emb" src="' + esc(emb) + '" alt="" loading="lazy">' : "") + "</header>";
    // stats + supply
    var stats = [["SPEED", st.speed], ["ARMOUR", st.armour], ["EVADE", st.evade], ["HIT POINTS", st.hp]];
    if (st.shield != null) stats.push(["SHIELD", st.shield]);
    stats.push(["SIZE", st.size]);
    h += '<div class="sc-statrow"><div class="sc-stats">' + stats.map(function (s) { return '<div class="sc-st' + (s[0] === "SHIELD" ? " sc-sh" : "") + '"><span>' + s[0] + "</span><b>" + esc(s[1]) + "</b></div>"; }).join("") + "</div>";
    h += '<table class="sc-sup"><thead><tr><th colspan="' + u.supply_profile.length + '">MODELS / SUPPLY</th></tr></thead><tbody><tr>' +
      u.supply_profile.map(function (b) { return "<td>" + esc(b.models) + "</td>"; }).join("") + "</tr><tr>" +
      u.supply_profile.map(function (b) { return "<td><b>" + b.supply + "</b></td>"; }).join("") + "</tr></tbody></table></div>";
    if (entry && comp) {
      var c = C.entryCost(entry);
      h += '<div class="sc-fielded">FIELDED: <b>' + entry.models + " MODELS</b> · SUPPLY <b>" + c.supply + '</b> · <span class="sc-min">' + c.total + " MINERALS</span>" + (c.upgrades ? " (" + c.base + " + " + c.upgrades + " upgrades)" : "") + "</div>";
    }
    // phases
    PHASES.forEach(function (p) {
      var ws = u.weapons.filter(function (w) { return w.phase === p; });
      var ab = u.abilities.filter(function (a) { return a.phase === p; });
      if (!ws.length && !ab.length) return;
      h += '<section class="sc-sec">' + phaseHead(p);
      h += ab.map(function (a) { return abilityBox(a); }).join("");
      h += weaponTable(ws, { replaced: lo ? lo.replaced : null });
      h += "</section>";
    });
    // upgrades
    if (u.upgrades.length) {
      h += '<div class="sc-upband">&#9650; UPGRADES</div>';
      PHASES.forEach(function (p) {
        var ups = u.upgrades.filter(function (x) { return x.phase === p; });
        if (!ups.length) return;
        h += '<section class="sc-sec">' + phaseHead(p, "UPGRADE");
        ups.forEach(function (x) {
          var costText = (x.cost_by_composition || []).map(function (v, i) { return v + (u.compositions.length > 1 ? " (" + u.compositions[i].models + ")" : ""); }).join(" / ");
          if (comp && x.cost_by_composition) costText = x.cost_by_composition[comp.index] + " MINERALS";
          var sp = entry && entry.specialists && entry.specialists[x.name];
          if (x.kind === "weapon") {
            var costs = {}, taken = {}, spec = {}; costs[x.name] = costText; taken[x.name] = !!takenNames[x.name]; if (sp) spec[x.name] = sp;
            h += '<div class="sc-upw' + (takenNames[x.name] ? " sc-taken" : "") + '"><span class="sc-uptag">UPGRADE' + (x.specialist ? " · SPECIALIST" : "") + (takenNames[x.name] ? " · TAKEN" : "") + "</span>" +
              weaponTable([x], { costs: costs, specialist: spec }) + "</div>";
          } else {
            h += abilityBox(x, { upgrade: true, taken: !!takenNames[x.name], costText: costText + (takenNames[x.name] ? " · TAKEN" : "") });
          }
        });
        h += "</section>";
      });
    }
    // footer
    h += '<footer class="sc-foot"><span><em>COMBAT TAGS:</em> ' + esc(u.combat_tags.join(", ").toUpperCase()) + "</span>" +
      '<span class="sc-ftags">' + u.faction_tags.map(function (t) { return '<i>' + esc(t.toUpperCase()) + "</i>"; }).join("") + "</span></footer>";
    var fine = []; if (u.base_mm) fine.push("Base Ø " + u.base_mm + (typeof u.base_mm === "number" ? "mm" : ""));
    if (u.card_version) fine.push("Card " + u.card_version);
    if (u.compositions && u.compositions.length) fine.push("Cost table: " + u.compositions.map(function (c) { return c.models + " models " + c.minerals + " / Supply " + c.supply; }).join(" · "));
    (u.corrections || []).forEach(function (x) { fine.push("Corrected: " + x); });
    (u.notes || []).forEach(function (x) { fine.push("Note: " + x); });
    h += '<div class="sc-fine">' + fine.map(esc).join("<br>") + "</div>";
    h += "</div></article>";
    return h;
  }

  /* ---------- TACTICAL / FACTION / CREEP CARD ---------- */
  function slotsText(slots) {
    var k = Object.keys(slots);
    return k.length ? k.map(function (s) { return slots[s] + " × " + s.toUpperCase(); }).join(", ") : "-";
  }
  function tacCardHTML(C, c, src, count) {
    src = src || identity;
    var artSrc = src(ART.card(c.id));
    var h = '<article class="sc-card sc-tac' + (artSrc ? "" : " sc-noart") + '" data-race="' + esc(c.race) + '">';
    if (artSrc) h += '<div class="sc-art sc-tacart"><img src="' + esc(artSrc) + '" alt="" loading="lazy"></div>';
    h += '<div class="sc-body"><header class="sc-title"><div class="sc-tl"><h3>' + esc(c.name.toUpperCase()) + (count > 1 ? " ×" + count : "") + "</h3>" +
      '<div class="sc-meta"><span><em>' + esc(c.kind.toUpperCase()) + " CARD</em></span>" + (c.unique ? '<span class="sc-uq">UNIQUE</span>' : "") +
      (c.gas_cost != null && c.kind !== "Faction" ? '<span class="sc-gas">' + c.gas_cost + " VESPENE GAS</span>" : "") + "</div></div>" +
      (c.resource && c.resource.value != null ? '<span class="sc-res">' + esc(c.resource.type) + ": " + esc(c.resource.value) + "</span>" : "") + "</header>";
    PHASES.forEach(function (p) {
      var ab = c.abilities.filter(function (a) { return a.phase === p; });
      if (!ab.length) return;
      h += '<section class="sc-sec">' + phaseHead(p) + ab.map(function (a) { return abilityBox(a); }).join("") + "</section>";
    });
    h += '<footer class="sc-foot"><span><em>SUPPLY:</em> ' + esc(slotsText(c.slots)) + '</span><span class="sc-ftags">' + c.faction_tags.map(function (t) { return "<i>" + esc(t.toUpperCase()) + "</i>"; }).join("") + "</span></footer>";
    var fine = []; if (c.card_version) fine.push("Card " + c.card_version);
    (c.corrections || []).forEach(function (x) { fine.push("Corrected: " + x); });
    (c.notes || []).forEach(function (x) { fine.push("Note: " + x); });
    if (fine.length) h += '<div class="sc-fine">' + fine.map(esc).join("<br>") + "</div>";
    return h + "</div></article>";
  }

  /* ---------- MISSION CARD (text) ---------- */
  function missionCardHTML(m, side) {
    var s = m[side];
    var lines = s.mission_parameters.map(function (x) { return "<p>" + richText(x) + "</p>"; }).join("");

    var tac = Object.keys(r.tactical || {}).filter(function (id) { return r.tactical[id]; }).map(function (id) { return C.cards[id].name + (r.tactical[id] > 1 ? " x" + r.tactical[id] : ""); });

  var loses = r.units.length + Object.keys(r.tactical).length + (r.creepId?1:0);
  if(r.race && loses && S.confirmRace!==race){ S.confirmRace = race; render(); return; }

function setFaction(id){
  var r = S.cur; if(r.factionId===id) return;
  r.factionId = id; var removed = [];
  var okT = C.eligibleTactical(r).map(function(c){return c.id;});
  Object.keys(r.tactical).forEach(function(k){ if(okT.indexOf(k)===-1){ removed.push(C.cards[k].name); delete r.tactical[k]; } });
  var okC = C.eligibleCreep(r).map(function(c){return c.id;});

function placeEditor(){

  var top = open.offsetTop, tiles = Array.prototype.filter.call(grid.children, function(n){ return n.classList.contains("utile"); });

var FORMATS = [
  {id:"manual", ext:"html", name:"Field manual", hero:true, art:true, desc:"Roster sheet plus the full card for every unit, summoned unit, Faction, Tactical and Creep Card, and your Mission Cards. Made for the table."},
  {id:"sheet", ext:"html", name:"Roster sheet", art:true, desc:"The tournament roster with every Organized Play field, laid out for printing."},
  {id:"text", ext:"txt", name:"Plain text", desc:"The full roster as plain text: units, loadouts, cards and totals."},
  {id:"compact", ext:"txt", name:"Compact list", suffix:"-list", desc:"A short list for messages and forum posts, one line per unit."},
  {id:"md", ext:"md", name:"Markdown", desc:"Tables for Discord, Reddit, GitHub or notes apps."},
  {id:"csv", ext:"csv", name:"Spreadsheet", desc:"One row per unit and card with the cost breakdown. Opens in Excel, Numbers or Google Sheets."},
  {id:"json", ext:"json", name:"Roster file", desc:"Brings this roster back into SurgeCraft later through Import, on any device."},
  {id:"zip", ext:"zip", name:"Everything", desc:"All seven formats above in one .zip file."}
];
function fmtById(id){ return FORMATS.filter(function(f){return f.id===id;})[0]; }
var imgCache = {};
function dataURL(path){
  if(imgCache[path]) return Promise.resolve(imgCache[path]);
  return fetch(path).then(function(r){ if(!r.ok) throw new Error("missing "+path); return r.blob(); }).then(function(b){
    return new Promise(function(res, rej){ var fr = new FileReader(); fr.onload = function(){ imgCache[path] = fr.result; res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); });
  });
}
function embedResolver(r, kind){
  var paths = Render.imagesFor(C, r, kind);
  return Promise.all(paths.map(function(p){ return dataURL(p).catch(function(){ return null; }); })).then(function(){
    return function(p){ return imgCache[p] || ""; };
  });
}
function baseName(){ var b = (S.exp.base || (S.cur && S.cur.name) || "roster").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").slice(0,60); return b || "roster"; }
function fileName(f){ return baseName() + (f.id==="manual"?"-field-manual":f.id==="sheet"?"-roster-sheet":(f.suffix||"")) + "." + f.ext; }
var BLANK = function(){ return ""; };
function build(f, forPreview){
  var r = S.cur, art = S.exp.art;
  switch(f.id){
    case "text": return Promise.resolve(X.textFull(C, r));
    case "compact": return Promise.resolve(X.textCompact(C, r));
    case "md": return Promise.resolve(X.markdown(C, r));
    case "csv": return Promise.resolve(X.csv(C, r));
    case "json": return Promise.resolve(X.json(C, r));
    case "sheet": return (forPreview ? Promise.resolve(null) : art ? embedResolver(r, "sheet") : Promise.resolve(BLANK)).then(function(res){ return X.rosterSheetDoc(C, r, res, {art: art}); });
    case "manual": return (forPreview ? Promise.resolve(art ? null : BLANK) : art ? embedResolver(r, "manual") : Promise.resolve(BLANK)).then(function(res){ return X.fieldManualDoc(C, r, res); });
    case "zip": return buildZip();
  }
  return Promise.reject({code:"unknown"});
}
function buildZip(){
  if(!window.JSZip) return Promise.reject({code:"nozip"});
  var z = new JSZip(), list = FORMATS.filter(function(f){ return f.id!=="zip"; });
  return list.reduce(function(p, f){ return p.then(function(){ return build(f).then(function(c){ z.file(fileName(f), c); }); }); }, Promise.resolve())
    .then(function(){ return z.generateAsync({type:"blob", compression:"DEFLATE"}); });
}

/* ------------ keyword reference ------------
   Definitions are the rulebook's own text (Full Rules, Part 11), shipped in keywords.js.
   Keywords printed in card text become tappable wherever card text is shown in the app;
   exported files are left as plain text. */
var KW = window.Keywords || null;
var KW_SCOPE = ".sc-card, .u-desc, .sc-mission, .kw-body";
var KW_SKIP = ".sc-abn, .sc-wn, .sc-for, .sc-uptag, .sc-pill, .sc-title, .sc-phtab, .sc-upband, h1, h2, h3, h4, button, summary, textarea, input, select, script, style";
function kwBodyHTML(k){
  var h = "", list = false;
  k.body.forEach(function(b){
    if(b[0]==="li"){ if(!list){ h += "<ul>"; list = true; } h += "<li>"+Render.richText(b[1])+"</li>"; }
    else { if(list){ h += "</ul>"; list = false; } h += "<p>"+Render.richText(b[1])+"</p>"; }
  });
  if(list) h += "</ul>";
  return '<div class="kw-body" data-kwself="'+esc(k.id)+'">'+h+'</div>';
}
function linkKeywords(root){
  if(!KW || !root || root.nodeType!==1) return;
  var scopes = root.matches(KW_SCOPE) ? [root] : [];
  scopes = scopes.concat([].slice.call(root.querySelectorAll(KW_SCOPE)));
  scopes.forEach(function(sc){
    var w = document.createTreeWalker(sc, NodeFilter.SHOW_TEXT, null), nodes = [], n;
    while((n = w.nextNode())) nodes.push(n);
    nodes.forEach(function(tn){
      var p = tn.parentElement; if(!p || !tn.parentNode || p.closest(KW_SKIP)) return;
      var hits = KW.find(tn.nodeValue); if(!hits.length) return;
      var self = p.closest("[data-kwself]"); self = self ? self.getAttribute("data-kwself") : null;
      hits = hits.filter(function(x){ return x.id!==self; }); if(!hits.length) return;
      var s = tn.nodeValue, pos = 0, frag = document.createDocumentFragment();
      hits.forEach(function(x){
        if(x.start>pos) frag.appendChild(document.createTextNode(s.slice(pos, x.start)));
        var b = document.createElement("button");
        b.type = "button"; b.className = "kw"; b.setAttribute("data-a", "kw"); b.setAttribute("data-v", x.id);
        b.setAttribute("aria-haspopup", "dialog"); b.textContent = s.slice(x.start, x.end);
        frag.appendChild(b); pos = x.end;
      });
      if(pos<s.length) frag.appendChild(document.createTextNode(s.slice(pos)));
      tn.parentNode.replaceChild(frag, tn);
    });
  });
}
var kwQueue = [], kwRaf = 0;
if(KW && window.MutationObserver){
  new MutationObserver(function(muts){
    muts.forEach(function(m){ m.addedNodes.forEach(function(nd){ if(nd.nodeType===1 && !(nd.classList && nd.classList.contains("kw"))) kwQueue.push(nd); }); });
    if(kwQueue.length && !kwRaf) kwRaf = requestAnimationFrame(function(){ var q = kwQueue; kwQueue = []; kwRaf = 0; q.forEach(function(nd){ if(nd.isConnected) linkKeywords(nd); }); });
  }).observe(document.body, {childList:true, subtree:true});
}

function bClick(a, v, eu, t){

    case "b-start":
      var nb = BT.create(C, r, BS.set); if(!nb) return true;
      r.battle = nb; BS.undo = []; BS.warn = []; BS.pass = false; BS.quit = false; BS.adj = {me:0, opp:0}; BS.openAb = {};
      bCommit(); window.scrollTo(0,0); return true;

  if(!b) return false;
